# REQ: NFR-005 — dependency updates arrive as pull requests that CI checks like any other change
# (clippy, the test suites, cargo-deny, the UI suite). The root Cargo workspace is checked weekly on
# Monday, the other ecosystems monthly, all at 02:00 New York time. At most 2 (root Cargo) or 1 (every
# other entry) update pull requests are open per entry. Minor and patch updates are grouped so a
# batch of them is one review; a major update is its own pull request. Pull requests are not rebased
# automatically (`rebase-strategy: disabled`; comment `@dependabot rebase` to refresh one). A release
# has to be 5 days old before Dependabot offers it (cooldown). Security updates ignore the schedule,
# the cooldown and the limit (Dependabot's own setting).
#
# Dependabot titles can't carry a requirement ID (AGENTS.md rule 2), and this repository allows
# merge commits only: put the tag in the merge commit's subject, for example
# `merge: dependabot ui-minor-patch into main; vite 8.3.2 to 8.3.8 [NFR-005]`.
version: 2
updates:
  # The Rust workspace (Cargo.lock at the root).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: "America/New_York"
    # REQ: OPS-004 - two, not five: each PR starts ci, image, cluster3 and keepalived, and a
    # burst of them starved the account's runners (CI 2026-11-20).
    open-pull-requests-limit: 2
    rebase-strategy: "disabled"
    cooldown:
      default-days: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      rust-minor-patch:
        update-types: [minor, patch]
    ignore:
      # aes 0.9 moves to the cipher 0.5 traits (`BlockEncrypt` and `encrypt_block` are gone), so
      # wrendns-snmp doesn't build with it (CI 2026-11-20). Porting the SNMP privacy code is its own
      # task; until then the 0.9 series is not offered. Remove this entry with that port.
      - dependency-name: "aes"
        versions: [">= 0.9.0, < 0.10.0"]
      # jiff 1.0 is a major change that needs its own port (the owner deferred it). Until that port
      # lands, its major update is not offered. Remove this entry with that port.
      - dependency-name: "jiff"
        update-types: ["version-update:semver-major"]

  # The fuzz targets are their own workspace.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: monthly
      time: "02:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    cooldown:
      default-days: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      fuzz-minor-patch:
        update-types: [minor, patch]

  # The web UI (build and test tooling; the UI ships as static files).
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: monthly
      time: "02:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    cooldown:
      default-days: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      ui-minor-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 doesn't install with the rest of the UI's toolchain yet (npm ci fails): wait.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # The MCP end-to-end test's client (test tooling only).
  - package-ecosystem: npm
    directory: /deploy/mcp-e2e
    schedule:
      interval: monthly
      time: "02:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    cooldown:
      default-days: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      mcp-e2e-minor-patch:
        update-types: [minor, patch]

  # The workflows' actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    cooldown:
      default-days: 5
    commit-message:
      prefix: "build(ci)"
    # Minor and patch updates share one pull request; a major update of an action is its own, so
    # a change that can break the workflows is reviewed (and bisected) alone.
    groups:
      actions:
        update-types: [minor, patch]
    ignore:
      # The ref after the @ is the Rust version to install (the workflows pin it, with
      # rust-toolchain.toml), not the action's own version.
      - dependency-name: "dtolnay/rust-toolchain"

  # The image's base images.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      time: "02:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 1
    rebase-strategy: "disabled"
    cooldown:
      default-days: 5
    commit-message:
      prefix: "build(image)"
