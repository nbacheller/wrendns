# REQ: 09 §4 — fmt → clippy → test → cargo-deny (image, integration, and bench stages are added by later tasks).
# This is the full tier (ADR-1073): every push to main, a dispatch, and a pull request only when it
# carries the `ci:full` label. The fast tier that every pull request gets is pr.yml, whose `pr-ok`
# job is the one required check. Track branches get no push runs (owner decision 2026-11-17): a run
# on one is started by hand with `gh workflow run ci.yml --ref <branch>` when it needs the hosted
# arm64 runner.
name: ci
on:
  push:
    branches: [main]
  pull_request:
    # `labeled` starts the full tier when the `ci:full` label is added to an open pull request.
    types: [opened, synchronize, reopened, labeled]
  # The release workflow starts CI for the commit it pushes to main (T9.26).
  workflow_dispatch:
# A newer push to the same branch supersedes a run still in progress (it would only spend minutes and
# the shared GitHub API limit); runs on main are never cancelled, the release workflow waits on them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: every job reads the repository and nothing more (the repository's default is
# read-only already; CodeQL's actions/missing-workflow-permissions asks for it to be explicit).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.99.0
        with: { components: rustfmt }
      - run: cargo fmt --all --check

  clippy:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    # OPS-004: the self-hosted runners when the repo variable names them (trusted events; pull
    # requests only while WRENDNS_PR_RUNNER is set, never from forks or Dependabot: they build third-party code), else GitHub-hosted.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && (!github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]' && vars.WRENDNS_PR_RUNNER || '"ubuntu-latest"') || vars.WRENDNS_RUNNER || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.99.0
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    # OPS-004: the self-hosted runners when the repo variable names them (trusted events; pull
    # requests only while WRENDNS_PR_RUNNER is set, never from forks or Dependabot: they build third-party code), else GitHub-hosted.
    runs-on: ${{ matrix.os == 'ubuntu-latest' && fromJSON(github.event_name == 'pull_request' && (!github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]' && vars.WRENDNS_PR_RUNNER || '"ubuntu-latest"') || vars.WRENDNS_RUNNER || '"ubuntu-latest"') || matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      - name: cargo test --workspace
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee "$RUNNER_TEMP/test.log"
      # REQ: API-902 (T27.13) - the guarded framework's tests that need the e2e test rows (the other
      # tests, including the release-build checks, run in the step above).
      - name: cargo test (feature e2e)
        run: cargo test -p wrendns-config -p wrendns-api -p wrendns --features wrendns/e2e,wrendns-config/e2e guarded
      # REQ: CLU-005 — T5.4b AC: the election simulator's 10,000 partition schedules.
      - name: wrendns-sim (10k schedules, release)
        shell: bash
        run: |
          set -o pipefail
          cargo test --release -p wrendns-cluster --test sim -- --nocapture 2>&1 | tee -a "$RUNNER_TEMP/test.log"
      # Job logs need a token to read; annotations don't. Surface failing tests there.
      - name: Annotate failing tests
        if: failure()
        shell: bash
        run: |
          grep -E "panicked at|^test .* \.\.\. FAILED|^    [a-z0-9_]+(::[a-z0-9_]+)+$" "$RUNNER_TEMP/test.log" \
            | head -20 | while IFS= read -r line; do echo "::error title=test failure::$line"; done

  deny:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2

  # REQ: NFR-001 — the harness runs end to end. Hosted runners are too noisy for the 5%
  # regression gate (09 §2 needs a fixed machine), so this fails only on loss or errors.
  bench-smoke:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      - run: sh .github/scripts/apt-install.sh dnsperf
        timeout-minutes: 12
      - run: make bench-smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-smoke
          path: bench/results/*.json
          if-no-files-found: ignore

  # REQ: DOC-004/005 — the site builds, links resolve, and Standards covers ticked tasks.
  site:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The SPDX check compares against the permissive-final tag, so it needs the history and tags.
        with: { fetch-depth: 0, fetch-tags: true }
      - run: python3 site/build.py --check
      # REQ: ADR-1033, ADR-1035 — every source file added since permissive-final carries the AGPL
      # SPDX header (old files are not mass-edited).
      - run: python3 scripts/test_check_spdx.py
      - run: python3 scripts/check-spdx.py
      # REQ: OPS-004 — no echo or printf piped into grep -q (fails under pipefail on large output).
      - run: python3 scripts/test_check_pipefail.py
      - run: python3 scripts/check-pipefail.py
      # REQ: OPS-004 (ADR-1073) — pr-ok fails on a failed, cancelled or unknown job result and on bad input.
      - run: python3 scripts/test_pr_ok.py
      # REQ: DOC-006 — no tracked file, built site page or generated doc names anything on the
      # maintainers' private denylist. The list is the repository secret PRIVACY_DENYLIST. On the
      # maintainers' own repository (a push, or a pull request from a branch of it) the list is
      # required and a missing secret fails the job; on a fork, or a pull request from one, where
      # secrets are not passed, the check skips with a notice. Hits name file:line and the pattern's
      # number, never the pattern. Dependabot's pull requests get Dependabot secrets only, so the
      # list is also stored as the Dependabot secret of the same name (owner decision, 2026-11-20)
      # and is required for them too.
      - run: python3 scripts/test_check_private.py
      - run: python3 site/build.py
      - run: python3 scripts/check-private.py
        env:
          WRENDNS_PRIVACY_DENYLIST_TEXT: ${{ secrets.PRIVACY_DENYLIST }}
          WRENDNS_PRIVACY_REQUIRED: ${{ github.repository == 'nbacheller/wrendns' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      # REQ: OBS-005 — the Grafana dashboard is regenerated from deploy/grafana/build.py.
      - run: python3 deploy/grafana/build.py --check
      # T10.6 — every P0 requirement has tests or evidence, and docs/v1-requirements.md is current.
      - run: python3 spec/trace.py --check

  # REQ: API-005 — T3.9 AC: the UI type-checks, its API types match docs/api/openapi.json,
  # the bundle stays within 400 KiB gzipped, and the Playwright suite passes against the
  # real binary.
  ui:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    # OPS-004: GitHub-hosted until each self-hosted runner has its own network namespace (this
    # job binds fixed host ports, which concurrent jobs on one host would share).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: API types match the OpenAPI document
        run: npm run types && git diff --exit-code src/lib/api-types.ts
      # REQ: AGT-001 (T6.5) — the OpenAPI document is agent-ready (.spectral.yaml).
      - name: OpenAPI lint (spectral)
        run: npx -y @stoplight/spectral-cli@6 lint ../docs/api/openapi.json --ruleset ../.spectral.yaml --fail-severity=warn
      - run: npm run check
      # REQ: API-011 — every "?" in the UI has a glossary topic and every topic is used.
      - run: npm run check:help
      - name: Build (fails over the size budget)
        run: npm run build
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      # REQ: API-902 (T27.13) - the e2e server has the guarded framework's test rows and restart hook
      # (the cargo feature `e2e`, never in a release build).
      - run: cargo build -p wrendns --features e2e
        working-directory: .
      - run: npx playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} --only-shell chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report
          if-no-files-found: ignore

  # REQ: API-004 — T3.6 AC: sign in through real Keycloak and Authentik (ui/tests/oidc/).
  oidc:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    # OPS-004: GitHub-hosted until each self-hosted runner has its own network namespace (this
    # job binds fixed host ports, which concurrent jobs on one host would share).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start Keycloak and Authentik
        run: docker compose -f tests/oidc/compose.yml up -d --wait --wait-timeout 300
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      # REQ: API-902 (T27.13) - the e2e server has the guarded framework's test rows and restart hook
      # (the cargo feature `e2e`, never in a release build).
      - run: cargo build -p wrendns --features e2e
        working-directory: .
      - run: npx playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} --only-shell chromium
      - name: Wait for Authentik to apply its blueprint
        run: |
          # Authentik's startup blueprint run can die on a Postgres deadlock and isn't retried
          # (CI 2026-10-04): after a minute, apply ours explicitly, then every minute after.
          for i in $(seq 60); do
            curl -sf -o /dev/null http://127.0.0.1:9000/application/o/wrendns/.well-known/openid-configuration && exit 0
            if [ "$i" -ge 12 ] && [ $((i % 12)) -eq 0 ]; then
              docker compose -f tests/oidc/compose.yml exec -T authentik-worker \
                ak apply_blueprint /blueprints/custom/wrendns.yaml || true
            fi
            sleep 5
          done
          exit 1
      - run: npm run test:e2e
        env:
          OIDC_E2E: keycloak,authentik
      - name: Provider logs
        if: failure()
        run: docker compose -f tests/oidc/compose.yml logs --tail 200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-oidc
          path: ui/playwright-report
          if-no-files-found: ignore

  # REQ: OPS-002, OPS-003 — T4.1 AC: chart-testing lint and install on kind (amd64) and k3d
  # (arm64), plus DNS through a LoadBalancer with the client's address in the query log.
  helm:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, tool: kind }
          - { runner: ubuntu-24.04-arm, tool: k3d }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: azure/setup-helm@v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - uses: helm/chart-testing-action@v2.9.0
      - run: ct lint --config ct.yaml --all
      # The monitoring templates need CRDs a test cluster lacks, so ct install never renders
      # them: lint them here (an unquoted ": " in an alert once slipped through).
      - name: Lint the optional monitoring templates
        run: |
          helm lint deploy/helm/wrendns --strict \
            --set prometheusRule.enabled=true --set serviceMonitor.enabled=true --set grafanaDashboard.enabled=true
      # REQ: CLU-008 (T6.11) — the alert rules fire on bad values and stay quiet on good ones.
      - name: Alert rules (promtool test rules)
        run: bash deploy/helm/alerts-test.sh
      # REQ: OPS-003 (GitHub issue #2) — the install notes warn about alsoServe next to resolver pods.
      - name: Install notes warn about alsoServe
        run: bash deploy/helm/notes-test.sh
      # REQ: OPS-014 (T23.3) — the secrets key is mounted on the controller only, never on
      # resolver pods, with persistence on and off.
      - name: Secrets key only on the controller
        run: bash deploy/helm/secrets-key-test.sh
      # REQ: OBS-016 — the standalone SLO rules file is rendered from the chart.
      - name: Standalone SLO rules are current
        # Its own virtualenv: chart-testing-action 2.9 leaves one active that has no pip.
        run: |
          /usr/bin/python3 -m venv "$RUNNER_TEMP/slo-venv"
          "$RUNNER_TEMP/slo-venv/bin/pip" install --quiet pyyaml
          PATH="$RUNNER_TEMP/slo-venv/bin:$PATH" bash deploy/prometheus/build.sh --check
      - name: Install kind
        if: matrix.tool == 'kind'
        uses: helm/kind-action@v1
        with: { install_only: true }
      - name: Install k3d
        if: matrix.tool == 'k3d'
        run: curl -sSfL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.8.3 bash
      - run: sh .github/scripts/apt-install.sh dnsutils
        timeout-minutes: 12
      - name: DNS through a LoadBalancer; client IP in the query log
        run: KEEP=1 E2E_KUBECONFIG="$RUNNER_TEMP/kubeconfig" TOOL=${{ matrix.tool }} bash deploy/helm/e2e.sh
      - name: ct install (every ci/*-values.yaml)
        run: KUBECONFIG="$RUNNER_TEMP/kubeconfig" ct install --config ct.yaml --all

  # REQ: OPS-004 — the Pi/Linux paths end to end on a disposable runner: the Compose bundle
  # (host network, healthcheck, hardening) and install.sh + the systemd unit (signed fake
  # release, DNS on port 53, upgrade in place, tampered releases refused).
  native:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ubuntu-latest
    # The cluster e2e's maintenance steps (T13.4) add about six minutes.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      # `wedge-test` is the watchdog e2e's hook (OPS-012): inert without WRENDNS_WEDGE_AFTER_SECS.
      - run: cargo build --profile bench-fast -p wrendns --features wedge-test
      - name: Compose bundle
        run: |
          sh .github/scripts/apt-install.sh dnsutils minisign
          mkdir ctx && cp target/bench-fast/wrendns ctx/
          printf '%s\n' 'FROM ubuntu:24.04' \
            'COPY wrendns /usr/local/bin/wrendns' \
            'RUN mkdir -p /var/lib/wrendns /etc/wrendns && chown 65532:65532 /var/lib/wrendns' \
            'ENTRYPOINT ["/usr/local/bin/wrendns"]' 'CMD ["run"]' > ctx/Dockerfile
          docker build -q -t wrendns:ci ctx
          bash deploy/compose/e2e.sh wrendns:ci
      # REQ: OPS-001 (T7.6 AC) — the guided installer's answers produce configs that pass
      # `config check`; Enter gives the starter config; no questions without a terminal.
      - name: install.sh guided setup (answers on stdin)
        run: bash deploy/systemd/guided-e2e.sh target/bench-fast/wrendns
      - name: install.sh + systemd unit
        run: sudo bash deploy/systemd/e2e.sh target/bench-fast/wrendns
      # REQ: OPS-004 (ADR-1028, T33.2) — the migration of a pre-rename native install, and the
      # release's pre-rename asset names (a fake root; no root or systemd needed).
      - name: pre-rename install migration and asset names
        run: |
          sh deploy/systemd/tests/migrate-test.sh
          sh deploy/release/tests/legacy-assets-test.sh
      # REQ: CLU-003, CLU-004 (T5.2/T5.3 AC) — a primary and a replica as real processes:
      # replication, propagation, 100% answers while the primary is killed, cold start ≤ 500 ms;
      # OPS-010 (T13.4): maintenance on the replica from the primary, restarts, a stopped node.
      - name: Cluster (two processes)
        run: bash deploy/cluster/e2e.sh target/bench-fast/wrendns
      # REQ: CLU-005 (T5.4b AC) — automatic failover with a witness: the replica is elected
      # within 30 s of the primary's death with 100% of DNS answered; the old primary follows.
      # OPS-010 (T13.4): a node in maintenance isn't elected; the primary hands over.
      - name: Cluster automatic failover (primary, replica, witness)
        run: bash deploy/cluster/failover-e2e.sh target/bench-fast/wrendns
      # REQ: CLU-005 (ADR-154, GitHub issue #3) — the GitOps authority with automatic failover:
      # a node that isn't Git-managed becomes the emergency primary, and when the Git-managed
      # node returns it asks for the handover and is elected, with DNS answered throughout.
      - name: Cluster GitOps takeover (emergency primary, automatic failover)
        run: bash deploy/cluster/gitops-failover-e2e.sh target/bench-fast/wrendns
      # REQ: CLU-001 (ADR-155, GitHub issue #5) — removing a node: one that is up needs force and
      # doesn't come back, the removed list reaches the other replica, a stale record goes
      # through a replica and is audited with the entry node.
      - name: Cluster node removal
        run: bash deploy/cluster/remove-e2e.sh target/bench-fast/wrendns
      # REQ: OPS-012 (ADR-163, GitHub issue #7) — a node whose runtime is stuck writes its dump and
      # exits with status 70 for its supervisor; the next run says why and reports the watchdog.
      - name: Watchdog (a stuck runtime is dumped and restarted)
        run: bash deploy/watchdog/e2e.sh target/bench-fast/wrendns
      # REQ: CLU-001 (T5.4c AC) — rotate the cluster CA under DNS load, every phase gated on
      # every member; replication and reconnection afterwards.
      - name: Cluster CA rotation
        run: bash deploy/cluster/rotate-e2e.sh target/bench-fast/wrendns
      # REQ: CLU-013 (T13.2 AC) — staged rollouts: canary first, the guard pins a bad version,
      # 409 while pinned, unpin, a manual pin, and the pin surviving failover.
      - name: Cluster staged rollouts and pins
        run: bash deploy/cluster/rollout-e2e.sh target/bench-fast/wrendns
      # REQ: CLU-010 (T5.11 AC) — rolling upgrade: the published edge build (N-1) and this
      # build (N) in one cluster, both ways round, with a two-server client never failing.
      # REQ: OPS-004 - the edge build comes through the API with the job's token (an anonymous
      # download of a private repository's release is a 404), and a repository with no edge
      # release yet (a fresh one) skips the step with a notice instead of failing.
      - name: Cluster rolling upgrade (edge build and this build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view edge -R "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            echo "::notice title=rolling upgrade::$GITHUB_REPOSITORY has no edge release yet: the rolling upgrade from the edge build is skipped."
            exit 0
          fi
          gh release download edge -R "$GITHUB_REPOSITORY" -p wrendns-x86_64-linux -D "$RUNNER_TEMP/edge" --clobber
          mv "$RUNNER_TEMP/edge/wrendns-x86_64-linux" "$RUNNER_TEMP/wrendns-old"
          chmod +x "$RUNNER_TEMP/wrendns-old"
          bash deploy/cluster/upgrade-e2e.sh "$RUNNER_TEMP/wrendns-old" target/bench-fast/wrendns
      # REQ: DNS-011 (T6.1) — DNSSEC validation against the real DNS tree (needs internet).
      - name: DNSSEC validation (live)
        run: bash deploy/dnssec-e2e.sh target/bench-fast/wrendns
      # REQ: CLU-003 (T5.12 AC) — the cluster's configuration from a Git repository (served by
      # git upload-pack over HTTP): same commit everywhere, invalid and force-pushed commits
      # refused, outages harmless, a promoted node keeps following.
      - name: Cluster configuration from Git
        run: bash deploy/cluster/git-e2e.sh target/bench-fast/wrendns
      # REQ: CLU-009 (T5.10 AC) — Helm mode: scaled on kind with this build: resolver pods join
      # and sync, answer DNS; a node outside Kubernetes joins; a deleted pod expires.
      - name: Install kind
        uses: helm/kind-action@v1
        with: { install_only: true }
      - name: Helm scaled mode on kind
        run: bash deploy/helm/scaled-e2e.sh target/bench-fast/wrendns

  # REQ: API-007 — moving to and between WrenDNS installs: importers against the real
  # Pi-hole and Technitium images (Docker), and backup/restore across two nodes. A job of its
  # own: the image pulls and Pi-hole's first gravity run take minutes.
  migration:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    # OPS-004: GitHub-hosted until each self-hosted runner has its own network namespace (this
    # job binds fixed host ports, which concurrent jobs on one host would share).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      - run: cargo build --profile bench-fast -p wrendns
      - run: sh .github/scripts/apt-install.sh dnsutils
        timeout-minutes: 12
      # REQ: API-007 (T6.7) — a backup from a running node restores onto a fresh one.
      - name: Backup and restore
        run: bash deploy/backup-e2e.sh target/bench-fast/wrendns
      # REQ: AGT-002/004/005/009 (T6.5) — agent tokens on a running node: scopes, a dry run for
      # every change, required reasons, attribution, the kill switch.
      - name: Agent tokens
        run: bash deploy/agent-e2e.sh target/bench-fast/wrendns
      # REQ: AGT-006 (T6.6) — the MCP server with the official TypeScript SDK client, over HTTP
      # and `wrendns mcp --stdio`, including the "why is the TV slow?" story.
      - name: MCP server
        run: bash deploy/mcp-e2e.sh target/bench-fast/wrendns
      # REQ: OBS-010 (T7.12, T7.13) — event sinks (file, syslog, webhook) and an alert from a
      # running node.
      - name: Event sinks and alerts
        run: bash deploy/sinks-e2e.sh target/bench-fast/wrendns
      # REQ: API-008 (T7.25) — `wrendns ctl` against a running node.
      - name: wrendns ctl
        run: bash deploy/ctl-e2e.sh target/bench-fast/wrendns
      # REQ: OBS-010 (T9.4) — alert email against a scripted SMTP server (STARTTLS, TLS, AUTH).
      - name: Alert email
        run: bash deploy/email-e2e.sh target/bench-fast/wrendns
      # REQ: T8.2 — router integrations against fake UniFi and OPNsense APIs.
      - name: Router integrations
        run: bash deploy/routers-e2e.sh target/bench-fast/wrendns
      # REQ: API-007 (T6.3) — Pi-hole import from real Teleporter exports of the official v6
      # and v5 images, then the imported configuration's answers.
      - name: Pi-hole import (v6 and v5 Teleporter)
        run: bash deploy/pihole-import-e2e.sh target/bench-fast/wrendns
      # REQ: API-007 (T6.4) — Technitium import through the API of the official image.
      - name: Technitium import (API)
        run: bash deploy/technitium-import-e2e.sh target/bench-fast/wrendns
  # REQ: API-007, DSC-002 (ADR-988, ADR-989) — the sandboxed workers in the shipped shape: the
  # musl binary (mimalloc, reserving address space `RLIMIT_DATA` counts), the scratch image with a
  # read-only root and no /tmp. The discovery worker handshakes under its limit and the import
  # worker previews a gravity.db and a Teleporter zip. `bench-fast` is the release profile without
  # fat LTO: the same musl toolchain, allocator and limits, in a quarter of the build time.
  worker-image:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@v3
      - name: Build the musl image
        run: docker buildx build --platform linux/amd64 --build-arg PROFILE=bench-fast --load -t wrendns:ci .
      - name: Workers in the image (discovery handshake, Pi-hole import)
        run: bash deploy/worker-image-e2e.sh wrendns:ci
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      - name: Worker tests on an optimized build
        run: cargo test -j 4 --profile bench-fast -p wrendns --test pihole_import_worker --test discovery_workers
  # REQ: DSC-003 (T25.4, ADR-908) — the SNMP client against net-snmp `snmpd` in a container on an
  # RFC 1918 Docker network: v2c GET and walk, v3 SHA with and without AES.
  snmp:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      - run: bash deploy/snmp-e2e.sh
      # REQ: DSC-003 (T25.5): v3 at authNoPriv and authPriv, SHA and SHA-256, on its own network.
      - run: bash crates/wrendns-snmp/tests/v3-e2e.sh
      # REQ: DSC-003 (T25.5): the AES-CFB vectors on the software backend (what arm/v7 uses).
      - name: AES vectors, software backend
        run: RUSTFLAGS="--cfg aes_force_soft" cargo test -j 4 -p wrendns-snmp --lib --target-dir target/soft aes_cfb
      # The same vectors on arm/v7 itself, under QEMU user emulation.
      - uses: docker/setup-qemu-action@v4
        with: { platforms: arm }
      - name: AES vectors, arm/v7 under QEMU
        run: |
          docker run --rm --platform linux/arm/v7 -v "$PWD":/src -w /src -e CARGO_TARGET_DIR=/tmp/t rust:1.99-bookworm cargo test -j 2 -p wrendns-snmp --lib aes_cfb
