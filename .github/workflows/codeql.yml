# REQ: NFR-005 — CodeQL code scanning, as an advanced setup so test code can be left out of it
# (.github/codeql/codeql-config.yml). It replaces GitHub's default setup (switch that off in
# Settings → Code security first: results from this workflow are refused while it is on).
# The categories are the default setup's, so existing alerts keep their identity.
name: codeql
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # REQ: NFR-005, OPS-004 — code scanning needs GitHub Advanced Security, which a private personal
  # repository doesn't have (every run failed with "Code scanning is not enabled for this
  # repository"). So the analysis runs only while the repository is public, and switches itself on
  # when it goes public: nothing to edit then. The event payload names the repository on push, pull
  # request and dispatch but not on schedule, so the visibility is read from the API (one call).
  visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      public: ${{ steps.check.outputs.public }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PRIVATE: ${{ github.event.repository.private }}
        run: |
          private="$EVENT_PRIVATE"
          if [ -z "$private" ]; then
            private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)
          fi
          if [ "$private" = "false" ]; then
            echo "public=true" >> "$GITHUB_OUTPUT"
          else
            echo "public=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=codeql::$GITHUB_REPOSITORY is private: code scanning needs GitHub Advanced Security, so CodeQL is skipped until the repository is public."
          fi

  analyze:
    name: analyze (${{ matrix.language }})
    needs: visibility
    if: ${{ needs.visibility.outputs.public == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
