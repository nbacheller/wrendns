# REQ: DOC-001, DOC-005 (T33.3, ADR-1030) — build, check and deploy the project site to wrendns.com.
# The site is hosted on Azure Static Web Apps (Free): a Static Web App in its own resource group; the
# `wrendns.com` zone is in Azure DNS there. This workflow builds site/ (python3 site/build.py: partials,
# generated pages, the link, brand and Content-Security-Policy checks) and uploads site/_site with the
# repository secret AZURE_STATIC_WEB_APPS_API_TOKEN. Without that secret the site is still built and
# checked, and the deploy step says it was skipped. The workflow replaces the GitHub Pages one.
name: site
on:
  push:
    branches: [main]
    # The "For nerds" page reads the crates (arrows, line counts, types) and the specs (ADRs,
    # requirements, budgets), and the configuration and Helm pages read the schema and chart, so changes
    # there redeploy the site too.
    paths: ["site/**", "brand/**", "docs/config-schema.json", "docs/help/**", "deploy/helm/wrendns/values.yaml", "deploy/helm/wrendns/values.schema.json", "spec/**", "crates/**", "Cargo.toml", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Only whether the secret exists, never its value: the token is passed to the deploy step alone.
      HAS_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: Build site (partials, standards, brand, links, Content-Security-Policy)
        run: python3 site/build.py
      # T9.23 — the newest nightly coverage report at /coverage/ (a placeholder until one exists).
      - name: Coverage report from the nightly workflow
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p site/_site/coverage
          for id in $(gh run list -R "$GITHUB_REPOSITORY" -w nightly --limit 10 --json databaseId -q '.[].databaseId'); do
            if gh run download "$id" -R "$GITHUB_REPOSITORY" -n coverage -D site/_site/coverage 2>/dev/null; then
              echo "coverage from nightly run $id"; break
            fi
          done
          if [ ! -f site/_site/coverage/index.html ]; then
            printf '<!doctype html><meta charset="utf-8"><title>Test coverage</title><p>No coverage report yet: the nightly workflow makes one.</p>\n' > site/_site/coverage/index.html
          fi
      # REQ: DOC-006 — nothing on the private denylist reaches the public site. The check runs on
      # the built site (with the coverage report) before anything is deployed, and the list is
      # required whenever a deploy would happen: a missing PRIVACY_DENYLIST secret fails the job
      # instead of publishing an unchecked site. Hits name file:line and a pattern number only.
      - name: Privacy check (tracked files, built site, generated docs)
        env:
          WRENDNS_PRIVACY_DENYLIST_TEXT: ${{ secrets.PRIVACY_DENYLIST }}
          WRENDNS_PRIVACY_REQUIRED: ${{ env.HAS_TOKEN }}
        run: python3 scripts/check-private.py
      - name: Lighthouse (all categories >= 0.9)
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: site/lighthouserc.json
          uploadArtifacts: true
      - name: Deploy to Azure Static Web Apps
        if: env.HAS_TOKEN == 'true'
        # Pinned to a full commit SHA (the v1 tag): a moved tag can't change what runs with the token.
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: site/_site
          api_location: ""
          skip_app_build: true
          skip_api_build: true
          production_branch: main
      - name: Deploy skipped
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::notice title=site::AZURE_STATIC_WEB_APPS_API_TOKEN is not set: the site was built and checked, not deployed."
