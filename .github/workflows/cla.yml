# REQ: ADR-1033 §3 (T33.5) — outside contributions need the Contributor Licence Agreement in CONTRIBUTING.md,
# which lets MySummitKeep, LLC offer WrenDNS under a commercial licence as well as the AGPL.
#
# CLA Assistant Lite: a contributor signs by commenting the sentence below on their pull request; the
# signature (GitHub login and id, the PR, the time) is committed to signatures/cla.json on the branch
# `cla-signatures`, which keeps it out of main's history. No GitHub App is installed: the workflow's own
# GITHUB_TOKEN does it. The check is required by the `main` ruleset under the context `cla` (this file's
# job id, reported by the GitHub Actions app; added 2026-11-26), and the `cla-signatures` branch is left
# out of the ruleset (the action commits to it).
#
# pull_request_target runs with this repository's token on a fork's PR, so this workflow never checks out
# or runs the PR's code: it only reads comments and writes the signature file and a status.
#
# REQ: OPS-004 — triggers kept to what the action needs, so the workflow leaves few skipped runs: pull
# requests into main only (opened, reopened, a push to the PR, closed for the lock), and new comments.
# GitHub can't filter issue_comment by its text, so a comment that isn't one of the two below still
# makes one skipped run (the job's `if`); comments posted with a workflow's GITHUB_TOKEN make none.
name: cla
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, closed]
    branches: [main]

permissions: {}

# One run at a time per pull request, none cancelled: two runs for one PR could both write its
# signature. (A single repository-wide group would drop all but the newest queued run.)
concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    runs-on: ubuntu-latest
    # Only the two comments the action acts on, or a pull request event; never other issue comments.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    permissions:
      actions: write        # re-runs the PR's earlier CLA check after a signature
      contents: write       # commits signatures/cla.json to the cla-signatures branch
      pull-requests: write  # comments on the PR, and locks it after merge so a signature can't be deleted
      statuses: write       # the CLA status on the PR's head commit
    steps:
      - name: CLA Assistant Lite
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/nbacheller/wrendns/blob/main/CONTRIBUTING.md#contributor-licence-agreement
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          # The copyright holder's own account and the bots need no CLA.
          allowlist: nbacheller,dependabot[bot],github-actions[bot]
          signed-commit-message: 'chore(cla): $contributorName signed the CLA in #$pullRequestNo'
          create-file-commit-message: 'chore(cla): start the CLA signature file'
          custom-notsigned-prcomment: >-
            Thank you for your pull request. Before it can be merged, please read the WrenDNS
            [Contributor Licence Agreement](https://github.com/nbacheller/wrendns/blob/main/CONTRIBUTING.md#contributor-licence-agreement)
            and sign it by adding a comment to this pull request with exactly the sentence below. You keep the
            copyright in your work; the agreement lets MySummitKeep, LLC license it under the AGPL and under a
            commercial licence. You only sign once.
          custom-allsigned-prcomment: Everyone in this pull request has signed the CLA. Thank you.
