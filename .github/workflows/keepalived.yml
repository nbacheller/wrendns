# REQ: CLU-004, CLU-005, OPS-001, OPS-010 — the keepalived failover example (deploy/keepalived, T24.4):
# two TelltaleDNS nodes with keepalived sidecars, a witness, and a VIP on an internal bridge, checked
# by deploy/keepalived/e2e.sh (the failover, the cluster promotion, the maintenance hand-over). The job
# runs for changes to the example, the image's sources and the cluster code; scheduled workflows run
# only from main, so the push and pull request paths filter decides when it runs, and
# workflow_dispatch runs it by hand. The sidecars need NET_ADMIN (keepalived's VRRP), which Docker on
# the hosted runner allows by default.
name: keepalived
on:
  push:
    branches: [main, 'feat/**', 'test/**']
    paths:
      - 'crates/**'
      - 'Cargo.lock'
      - 'Dockerfile'
      - 'deploy/keepalived/**'
      - '.github/workflows/keepalived.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.lock'
      - 'Dockerfile'
      - 'deploy/keepalived/**'
      - '.github/workflows/keepalived.yml'
  workflow_dispatch:

# Least privilege: the job reads the repository and nothing more.
permissions:
  contents: read

jobs:
  vip-failover:
    runs-on: ubuntu-latest
    # The image is built from the Dockerfile on every run (the UI, then the workspace with thin LTO),
    # which dominates the run; the checks in e2e.sh take about five minutes on top of it.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: "Two nodes behind a VIP: failover, witness, maintenance (deploy/keepalived)"
        run: bash deploy/keepalived/e2e.sh
