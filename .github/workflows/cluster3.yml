# REQ: CLU-001..005, OPS-007 — the three-node test cluster (deploy/cluster3, T21.5): a primary and two
# replicas from the Dockerfile's image, the checks in deploy/cluster3/e2e.sh. It runs for changes to
# the cluster code; scheduled workflows run only from main, so the push and pull request paths
# filter decides when it runs, and workflow_dispatch runs it by hand.
name: cluster3
on:
  push:
    branches: [main, 'feat/**', 'test/**']
    paths:
      - 'crates/telltale-cluster/**'
      - 'crates/telltale/src/federated*'
      - 'crates/telltale/src/replication*'
      - 'crates/telltale/src/secrets*'
      - 'crates/telltale/src/routers*'
      - 'crates/telltale/src/discovery/**'
      - 'crates/telltale-api/**'
      - 'Dockerfile'
      - 'deploy/cluster3/**'
      - '.github/workflows/cluster3.yml'
  pull_request:
    paths:
      - 'crates/telltale-cluster/**'
      - 'crates/telltale/src/federated*'
      - 'crates/telltale/src/replication*'
      - 'crates/telltale/src/secrets*'
      - 'crates/telltale/src/routers*'
      - 'crates/telltale/src/discovery/**'
      - 'crates/telltale-api/**'
      - 'Dockerfile'
      - 'deploy/cluster3/**'
      - '.github/workflows/cluster3.yml'
  workflow_dispatch:

# Least privilege: the job reads the repository and nothing more.
permissions:
  contents: read

jobs:
  three-node:
    runs-on: ubuntu-latest
    # The first image build takes a few minutes (the build cache is empty on a new runner); the
    # checks take about three.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Three nodes: join, replicate, fail over, restart (deploy/cluster3)
        run: bash deploy/cluster3/e2e.sh
