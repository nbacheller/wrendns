# REQ: CLU-001..005, OPS-007 — the three-node test cluster (deploy/cluster3, T21.5): a primary and two
# replicas from the Dockerfile's image, the checks in deploy/cluster3/e2e.sh. It runs for changes to
# the cluster code; scheduled workflows run only from main, so the push and pull request paths
# filter decides when it runs, and workflow_dispatch runs it by hand (on a track branch too).
name: cluster3
on:
  push:
    branches: [main, 'feat/ipam-integrations']
    paths:
      - 'crates/wrendns-cluster/**'
      - 'crates/wrendns/src/federated*'
      - 'crates/wrendns/src/replication*'
      - 'crates/wrendns/src/secrets*'
      - 'crates/wrendns/src/routers*'
      - 'crates/wrendns/src/discovery/**'
      - 'crates/wrendns/src/cluster.rs'
      - 'crates/wrendns/src/forward.rs'
      - 'crates/wrendns/src/settings_kinds.rs'
      - 'crates/wrendns/src/managed.rs'
      - 'crates/wrendns/src/api_backend.rs'
      - 'crates/wrendns/src/main.rs'
      - 'crates/wrendns-api/**'
      - 'crates/wrendns-store/**'
      - 'crates/wrendns-config/**'
      - 'Cargo.lock'
      - 'Dockerfile'
      - 'deploy/cluster3/**'
      - '.github/workflows/cluster3.yml'
  pull_request:
    paths:
      - 'crates/wrendns-cluster/**'
      - 'crates/wrendns/src/federated*'
      - 'crates/wrendns/src/replication*'
      - 'crates/wrendns/src/secrets*'
      - 'crates/wrendns/src/routers*'
      - 'crates/wrendns/src/discovery/**'
      - 'crates/wrendns/src/cluster.rs'
      - 'crates/wrendns/src/forward.rs'
      - 'crates/wrendns/src/settings_kinds.rs'
      - 'crates/wrendns/src/managed.rs'
      - 'crates/wrendns/src/api_backend.rs'
      - 'crates/wrendns/src/main.rs'
      - 'crates/wrendns-api/**'
      - 'crates/wrendns-store/**'
      - 'crates/wrendns-config/**'
      - 'Cargo.lock'
      - 'Dockerfile'
      - 'deploy/cluster3/**'
      - '.github/workflows/cluster3.yml'
  workflow_dispatch:
# A newer push to the same branch supersedes a run still in progress (it would only spend minutes and
# the shared GitHub API limit); runs on main are never cancelled, the release workflow waits on them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: the job reads the repository and nothing more.
permissions:
  contents: read

jobs:
  three-node:
    runs-on: ubuntu-latest
    # A cold image build on a 4-vCPU runner (the UI, then the workspace with thin LTO, and an empty
    # build cache) takes well over the README's 3 to 6 minutes, which was measured on a warm 24-core
    # host; the checks take about five more. 60 minutes leaves room for both.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Three nodes: join, replicate, fail over, restart (deploy/cluster3)"
        run: bash deploy/cluster3/e2e.sh
