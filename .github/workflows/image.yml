# REQ: OPS-001 / T0.4 — multi-arch FROM-scratch image, size gate, QEMU smoke, `edge` on main.
# REQ: OPS-004 / T4.3 — the same build's static binaries, signed, as GitHub release assets:
# the `edge` prerelease follows main; a `v*` tag publishes a release and versioned image tags.
#
# Shape (ADR-1075, T39.5): `version` fixes one build identity; `image` is one leg per platform on
# its own runner, each compiling its architecture ONCE (one `docker buildx bake`, see
# deploy/image/leg-build.sh) and taking the image and the release binaries from that one compile;
# `assets` builds the release assets from the legs' binaries; `merge` (main and tags only) joins the
# legs' pushed images into one manifest list under the tags and signs it. Nothing builds twice and
# no step relies on a cache from an earlier step.
name: image
on:
  push:
    branches: [main]
    tags: ['v*']
  # REQ: OPS-004 (ADR-1073, T39.5) - no image build on pull requests (owner decision 2026-11-20): the
  # three-platform build takes the longest of any job and a pull request publishes nothing. The
  # image is built on main and on tags; `gh workflow run image.yml --ref <branch>` builds a branch
  # by hand.
  workflow_dispatch:

# Runs on main and on tags are never cancelled (they publish); a newer dispatch on another ref
# supersedes the one in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/wrendns

jobs:
  # One build identity for every architecture of this commit, computed once.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      build_version: ${{ steps.v.outputs.build_version }}
      build_commit: ${{ steps.v.outputs.build_commit }}
      build_date: ${{ steps.v.outputs.build_date }}
      build_channel: ${{ steps.v.outputs.build_channel }}
      source_date_epoch: ${{ steps.v.outputs.source_date_epoch }}
      deps_date_epoch: ${{ steps.v.outputs.deps_date_epoch }}
      # `true` on main and on `v*` tags (pushed, or started there by the release workflow, T9.26):
      # the only refs that push images and sign them. Any other ref builds and tests only.
      publish: ${{ steps.v.outputs.publish }}
    steps:
      # The whole history, not one commit: the dependency layer's stamp below is the time of the
      # last commit that changed the dependency inputs, which a one-commit checkout cannot find
      # (it would report the checkout's own commit and the layer would miss on every run). Only
      # this job needs it; the legs do not check out history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else echo "version=edge" >> "$GITHUB_OUTPUT"; fi
          # REQ: OPS-004 (ADR-046) — one build identity for every architecture of this commit.
          pkg=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then bv="${GITHUB_REF_NAME#v}"; ch=stable
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then bv="${pkg}-edge.${GITHUB_RUN_NUMBER}"; ch=edge
          else bv="${pkg}-pr.${GITHUB_RUN_NUMBER}"; ch=dev; fi
          # REQ: NFR-005 (T10.10) — the commit's time, not the build's: the same commit builds
          # the same bytes (a rebuild can be compared with what was published).
          date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)
          {
            echo "build_version=$bv"; echo "build_channel=$ch"; echo "build_date=$date"
            echo "build_commit=${GITHUB_SHA::7}"
            echo "source_date_epoch=$(git log -1 --format=%ct)"
            # REQ: NFR-005, NFR-001 (T39.4, ADR-1075) - the dependency layer's own stamp: the time
            # of the last change to the dependency inputs (deploy/image/deps-epoch.sh), so a commit
            # that changes only sources leaves the layer's cache key alone. Same commit, same value.
            echo "deps_date_epoch=$(deploy/image/deps-epoch.sh)"
          } >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else echo "publish=false" >> "$GITHUB_OUTPUT"; fi

  # One leg per platform, each on its own runner. The build stage is cross-compiled, so an arm leg
  # needs no arm runner; QEMU is only for running the arm image in the smoke test (T0.4 AC: runs on
  # arm64 under QEMU).
  image:
    name: image (${{ matrix.arch }})
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, arch: amd64 }
          - { platform: linux/arm64, arch: arm64 }
          - { platform: linux/arm/v7, arch: armv7 }
    permissions:
      contents: read
      # Pushes this platform's image by digest (main and tags only).
      packages: write
    env:
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
      OUT: bin/leg
      PUSH: ${{ needs.version.outputs.publish }}
      BUILD_VERSION: ${{ needs.version.outputs.build_version }}
      BUILD_COMMIT: ${{ needs.version.outputs.build_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@v4
        if: matrix.arch != 'amd64'
      - uses: docker/setup-buildx-action@v3

      # REQ: OPS-004 (ADR-1075, T39.5) - buildx's `type=gha` cache reads the Actions runtime token
      # and URLs from the environment, and a step's shell does not have them unless an action
      # exports them: without this step the cache silently did nothing. The leg's cache scope is
      # image-<arch> (deploy/image/docker-bake.hcl). This workflow has no pull_request trigger, so
      # only main, tags and a dispatch by someone with write access reach this step.
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      # REQ: OPS-004 - a hosted runner has about 8 GiB of memory and little free disk. The release
      # profile's last compile (fat LTO, one codegen unit) needs more memory than that: rustc was
      # killed on arm/v7 (CI 2026-11-20). Preinstalled toolchains this job never uses are removed to
      # make room, then a swap file is added, so the compile gets slower instead of failing. A first
      # try that put a 12 GiB swap file on /mnt filled the disk Docker builds on.
      - name: Disk and swap for the release compile
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / /mnt
          sudo fallocate -l 8G /wrendns-swap
          sudo chmod 600 /wrendns-swap
          sudo mkswap /wrendns-swap >/dev/null
          sudo swapon /wrendns-swap
          free -m
          df -h / /mnt

      - name: Registry login
        if: env.PUSH == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      # One bake, one compile of this architecture: it writes the OCI layout (size gate), loads the
      # image (smoke test), exports the `bin` stage (release binaries) and, on main and tags, pushes
      # the platform image by digest with no tag. The step fails if the log shows the compile twice.
      # The cache (scope image-<arch>, read and written only with the runtime variables the step above
      # exports) only speeds a later run; an empty cache is a full build.
      # A leg that fails a gate below leaves an untagged image in the registry and no tag: `merge`
      # runs only when every leg passed.
      - name: Build (one compile)
        env:
          CACHE: gha
          VERSION: ${{ needs.version.outputs.version }}
          REVISION: ${{ github.sha }}
          WRENDNS_BUILD_VERSION: ${{ needs.version.outputs.build_version }}
          WRENDNS_BUILD_COMMIT: ${{ needs.version.outputs.build_commit }}
          WRENDNS_BUILD_DATE: ${{ needs.version.outputs.build_date }}
          WRENDNS_BUILD_CHANNEL: ${{ needs.version.outputs.build_channel }}
          SOURCE_DATE_EPOCH: ${{ needs.version.outputs.source_date_epoch }}
          DEPS_DATE_EPOCH: ${{ needs.version.outputs.deps_date_epoch }}
        run: deploy/image/leg-build.sh

      - name: Size gate (≤ 25 MiB compressed per arch, ADR-916)
        run: python3 deploy/image/size.py --oci "$OUT/image.tar"

      - name: Smoke test
        run: |
          sh .github/scripts/apt-install.sh dnsutils
          deploy/image/smoke.sh "wrendns:smoke-$ARCH" "$PLATFORM"

      # T6.9 AC: every architecture reports the same version and commit; NFR-005 (T10.10): the
      # binary carries its dependency list (cargo-auditable).
      - name: Check the binary
        run: |
          f="$OUT/bin/wrendns"
          line="$BUILD_VERSION (commit $BUILD_COMMIT"
          grep -aqF "$line" "$f" || { echo "::error::$ARCH binary doesn't carry '$line'"; exit 1; }
          readelf -S "$f" | grep -q '\.dep-v0' || { echo "::error::$ARCH binary has no cargo-auditable data"; exit 1; }
          if [ "$ARCH" = amd64 ]; then chmod 755 "$f" && "$f" --version; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.arch }}
          path: bin/leg/bin/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PUSH == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: bin/leg/digest
          if-no-files-found: error
          retention-days: 7

  # The release assets, from the three legs' binaries: nothing is built here.
  assets:
    needs: [version, image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILD_VERSION: ${{ needs.version.outputs.build_version }}
      BUILD_COMMIT: ${{ needs.version.outputs.build_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: legs

      - name: Release binaries
        run: |
          mkdir dist
          cp legs/bin-amd64/wrendns dist/wrendns-x86_64-linux
          cp legs/bin-arm64/wrendns dist/wrendns-aarch64-linux
          cp legs/bin-armv7/wrendns dist/wrendns-armv7-linux
          chmod 755 dist/*
          dist/wrendns-x86_64-linux --version
          # T6.9 AC: every architecture reports the same version and commit.
          line="$BUILD_VERSION (commit $BUILD_COMMIT"
          for f in dist/wrendns-*; do
            grep -aqF "$line" "$f" || { echo "::error::$f doesn't carry '$line'"; exit 1; }
          done
          # REQ: OPS-013 (ADR-164) — each binary's debug file (symbols and line tables), compressed, as
          # `wrendns-<arch>-linux.debug.zst`: a stack taken from the stripped binary is read with it.
          # It is covered by the signed SHA256SUMS like the binaries (after the checks above, which
          # look for the version line inside every binary).
          sh .github/scripts/apt-install.sh zstd
          for pair in amd64:x86_64 arm64:aarch64 armv7:armv7; do
            src="legs/bin-${pair%%:*}/wrendns.debug"
            test -s "$src" || { echo "::error::no debug file for ${pair%%:*}"; exit 1; }
            zstd -10 -T0 -q "$src" -o "dist/wrendns-${pair##*:}-linux.debug.zst"
          done
          chmod 644 dist/*.debug.zst
          ls -l dist

      # REQ: NFR-005 (T10.10) — each binary carries its dependency list (cargo-auditable), and
      # each gets a CycloneDX SBOM read from that list, published with the release and covered
      # by the signed SHA256SUMS.
      - name: Dependency data and SBOMs
        run: |
          for f in dist/wrendns-*-linux; do
            readelf -S "$f" | grep -q '\.dep-v0' || { echo "::error::$f has no cargo-auditable data"; exit 1; }
          done
          curl -fsSLo /tmp/syft.tgz https://github.com/anchore/syft/releases/download/v1.54.1/syft_1.54.1_linux_amd64.tar.gz
          echo "c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47  /tmp/syft.tgz" | sha256sum -c -
          tar -xzf /tmp/syft.tgz -C /tmp syft
          for f in dist/wrendns-*-linux; do
            /tmp/syft scan "file:$f" -q -o "cyclonedx-json=$f.cdx.json"
          done
          python3 deploy/release/sbom_check.py dist/wrendns-*-linux.cdx.json

      - name: Checksums
        # ADR-1028: the pre-rename asset names too, for one release (deploy/release/legacy-assets.sh).
        run: |
          legacy="$(sh deploy/release/legacy-assets.sh dist)"
          (cd dist && sha256sum wrendns-* $legacy > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: dist/
          retention-days: 7

  # Joins the legs' pushed images into one manifest list under the tags, checks it, and signs it.
  # Main (`edge`, `sha-<7>`) and `v*` tags (the version, and without a pre-release suffix also X.Y,
  # X and latest), pushed or started there by the release workflow (T9.26). Nothing is pushed or
  # signed on any other ref.
  merge:
    needs: [version, image, assets]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      # REQ: NFR-005 (T10.10) — cosign signs the pushed images keylessly with this run's
      # GitHub OIDC identity (Sigstore's Fulcio certificate, Rekor transparency log).
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests

      - name: Registry login
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Create the manifest list
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags=(-t "$IMAGE:$VERSION")
            if [[ "$VERSION" != *-* ]]; then   # no pre-release suffix: also X.Y, X, and latest
              tags+=(-t "$IMAGE:${VERSION%.*}" -t "$IMAGE:${VERSION%%.*}" -t "$IMAGE:latest")
            fi
          else
            tags=(-t "$IMAGE:edge" -t "$IMAGE:sha-${GITHUB_SHA::7}")
          fi
          srcs=()
          for a in amd64 arm64 armv7; do
            d="$(cat "digests/digest-$a/digest")"
            [[ "$d" == sha256:* ]] || { echo "::error::no digest for $a"; exit 1; }
            srcs+=("$IMAGE@$d")
          done
          docker buildx imagetools create "${tags[@]}" "${srcs[@]}"
          echo "MAIN_TAG=${tags[1]#"$IMAGE:"}" >> "$GITHUB_ENV"

      - name: Check the pushed image (three platforms, ≤ 25 MiB each, ADR-916)
        run: |
          python3 deploy/image/check-platforms.py "$IMAGE:$MAIN_TAG" linux/amd64 linux/arm64 linux/arm/v7
          python3 deploy/image/size.py --remote "$IMAGE:$MAIN_TAG"

      # Signs the manifest list's digest, as one buildx push's metadata did before.
      - name: Sign
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE:$MAIN_TAG" --format '{{.Manifest.Digest}}')"
          [[ "$digest" == sha256:* ]] || { echo "::error::no manifest list digest for $IMAGE:$MAIN_TAG"; exit 1; }
          printf '{"containerimage.digest": "%s"}\n' "$digest" > "$RUNNER_TEMP/image.json"
          sh .github/scripts/cosign-sign.sh "$IMAGE" "$RUNNER_TEMP/image.json"

  # REQ: OPS-002 — the Helm chart as an OCI artifact, so others install it without cloning:
  # `helm install wrendns oci://ghcr.io/<owner>/charts/wrendns --version <v>`. Main
  # publishes `<chart version>-edge.<run>` (appVersion edge); a `v*` tag publishes that version.
  chart:
    needs: merge
    # A push to main or a v* tag, or the same started by the release workflow (T9.26).
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@v5
      - name: Package and push
        run: |
          base=$(awk '/^version:/ {print $2}' deploy/helm/wrendns/Chart.yaml)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; app="$v"
          else v="${base}-edge.${GITHUB_RUN_NUMBER}"; app=edge; fi
          helm package deploy/helm/wrendns --version "$v" --app-version "$app" -d out
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "out/wrendns-$v.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
          echo "::notice title=chart published::oci://ghcr.io/${{ github.repository_owner }}/charts/wrendns --version $v"

  # Signs SHA256SUMS with the release key (secret MINISIGN_SECRET_KEY; public half in
  # deploy/release/wrendns-release.pub and built into `wrendns self-update`) and publishes.
  release:
    needs: [version, assets, merge]
    # A push to main or a v* tag, or the same started by the release workflow (T9.26).
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    # Two pushes in a row replaced `edge` at once, and one got a 403; the newer one wins.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist
      - name: Sign
        id: sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          BUILD_CHANNEL: ${{ needs.version.outputs.build_channel }}
          BUILD_VERSION: ${{ needs.version.outputs.build_version }}
          BUILD_COMMIT: ${{ needs.version.outputs.build_commit }}
          BUILD_DATE: ${{ needs.version.outputs.build_date }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::warning title=release not published::Add the MINISIGN_SECRET_KEY repository secret to publish signed binaries (install.sh and self-update refuse unsigned ones)."
            echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          sh .github/scripts/apt-install.sh minisign
          # REQ: OPS-004 (ADR-046) — the release index nodes check for updates.
          python3 deploy/release/index.py dist "$BUILD_CHANNEL" \
            "$BUILD_VERSION" "$BUILD_COMMIT" \
            "$BUILD_DATE" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/${GITHUB_REF_NAME/main/edge}" \
            > dist/releases.json
          cat dist/releases.json
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/release.key"
          for f in SHA256SUMS releases.json; do
            minisign -S -s "$RUNNER_TEMP/release.key" -m "dist/$f" \
              -t "wrendns ${GITHUB_REF_NAME} ${GITHUB_SHA}"
          done
          rm "$RUNNER_TEMP/release.key"
          minisign -V -p deploy/release/wrendns-release.pub -m dist/SHA256SUMS
          minisign -V -p deploy/release/wrendns-release.pub -m dist/releases.json
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Publish edge prerelease
        if: steps.sign.outputs.signed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A newer push publishes its own edge; racing it only produced 403s (twice on
          # 2026-10-04/05), so a superseded run steps aside.
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::notice title=edge not published::main moved on to ${latest::7}; its run publishes edge"
            exit 0
          fi
          gh release delete edge --yes --cleanup-tag 2>/dev/null || true
          gh release create edge dist/* --prerelease --target "$GITHUB_SHA" \
            --title "edge (main @ ${GITHUB_SHA::7})" \
            --notes "Built from main at ${GITHUB_SHA}. Not a stable release: install with \`install.sh --edge\` or \`wrendns self-update --channel edge\`."
      - name: Publish release
        if: steps.sign.outputs.signed == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # REQ: OPS-004 (T9.26) — a stable tag is the latest release (what install.sh and
          # self-update take), titled, with its notes from deploy/release/notes/<tag>.md.
          flags=(--verify-tag --title "WrenDNS ${GITHUB_REF_NAME#v}" --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          notes="deploy/release/notes/$GITHUB_REF_NAME.md"
          [ -f "$notes" ] && flags+=(--notes-file "$notes")
          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}" \
            || gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  # REQ: OPS-004 (T9.26, ADR-097) — a stable tag isn't done until everything it publishes is
  # there and consistent: signed assets, "latest release", the four image tags, the chart.
  verify:
    needs: [merge, chart, release]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@v5
      - name: Verify the release
        run: |
          sh .github/scripts/apt-install.sh minisign
          sudo curl -fsSLo /usr/local/bin/cosign https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64
          echo "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71  /usr/local/bin/cosign" | sha256sum -c -
          sudo chmod 755 /usr/local/bin/cosign
          # The registry and "latest release" can lag the publish by a little.
          for i in 1 2 3; do
            sh deploy/release/verify.sh "${GITHUB_REF_NAME#v}" && exit 0
            echo "retrying in 30 s"; sleep 30
          done
          exit 1
