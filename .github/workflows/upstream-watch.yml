# REQ: OPS-004, DOC-006. Watch on the upstream project; the report goes to the fork's "Upstream watch" issue.
# Since ADR-1026 the fork is independent: there are no syncs, only fixes worth porting, so the watch runs
# on demand (gh workflow run upstream-watch.yml --ref <branch>), not daily. The ledger spec/upstream.md
# is read from the branch it is dispatched on. Nothing is written to the upstream repo. The checkout is
# pinned to a commit SHA.
name: upstream-watch

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the ledger (the dispatched branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the watch script is on the dispatched branch
        run: |
          if [ ! -f .github/scripts/upstream_watch.py ]; then
            echo "::error::.github/scripts/upstream_watch.py is missing on $GITHUB_REF_NAME."
            exit 1
          fi

      - name: Run the upstream watch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A transient gh or git network error retries; a deterministic failure fails after three tries.
          for attempt in 1 2 3; do
            if python3 .github/scripts/upstream_watch.py; then
              exit 0
            fi
            echo "::warning::upstream watch attempt ${attempt} failed"
            sleep 60
          done
          exit 1
