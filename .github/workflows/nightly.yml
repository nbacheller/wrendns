# The nightly tier (ADR-1073): the online checks, the three-node cluster, the keepalived failover,
# fuzzing, the advisory check and the full privacy scan every night; coverage, reproducible builds and the catalog check
# once a week (the second cron below). Scheduled workflows run only from main. The `report` job at
# the end opens one issue, "Nightly run failed", when a scheduled run fails, and comments on it
# while it stays open.
name: nightly
on:
  schedule:
    # Every night.
    - cron: "41 4 * * *"
    # Monday: the weekly set. The jobs below compare github.event.schedule with this exact string.
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      weekly:
        description: Run the weekly jobs (coverage, reproducible, catalog) as well
        type: boolean
        default: false
      seconds:
        description: Fuzz seconds per target
        default: "1800"

# Least privilege (OPS-004, ADR-1080): no permissions at the workflow level; every job sets its own,
# `contents: read` unless it says more (the coverage, catalog and report jobs add what they need).
permissions: {}

jobs:
  # REQ: UPS-004 / T1.6 AC — every preset endpoint resolves example.com.
  presets-online:
    if: github.event.schedule != '17 5 * * 1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Resolve example.com through every preset endpoint
        run: cargo test -p wrendns-upstream --test presets_online -- --ignored --nocapture

  # REQ: FLT-001 / ADR-017 — real published lists parse with < 0.1% invalid lines.
  lists-online:
    if: github.event.schedule != '17 5 * * 1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Download and parse published lists
        run: cargo test -p wrendns-filter --test lists_online -- --ignored --nocapture

  # T9.23 — test coverage, to find untested code (no threshold, no badge: see spec/09 §5).
  # The HTML report is published on the project site at /coverage/ by the pages workflow,
  # which this job starts when the report is ready. Weekly (ADR-1073).
  coverage:
    if: github.event.schedule == '17 5 * * 1' || inputs.weekly
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
        with: { toolchain: "1.99.0", components: llvm-tools-preview }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-llvm-cov
      - name: Run the tests under coverage
        # A failing or flaky test shouldn't cost the report: tests are CI's job.
        run: cargo llvm-cov --workspace --no-report --no-fail-fast -- --skip flt_004_a_slow_list || true
      - name: Report
        run: |
          cargo llvm-cov report --html --output-dir target/cov
          {
            echo '## Test coverage'
            echo
            echo '```'
            cargo llvm-cov report --summary-only | tail -n 60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: target/cov/html
          retention-days: 14
      - name: Publish on the project site
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run site.yml --ref main -R "$GITHUB_REPOSITORY"

  # REQ: NFR-005 (T10.10) — reproducible builds: two clean builds of this commit's amd64
  # release binary (the Dockerfile's `bin` stage, no cache) must be byte-identical. The build
  # identity is the commit's (as the image workflow stamps it), so anyone can rebuild a release
  # and compare it with the published binary.
  reproducible:
    if: github.event.schedule == '17 5 * * 1' || inputs.weekly
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build twice from scratch and compare
        run: |
          date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ)
          args="--build-arg WRENDNS_BUILD_VERSION=repro --build-arg WRENDNS_BUILD_COMMIT=${GITHUB_SHA::7} --build-arg WRENDNS_BUILD_DATE=$date --build-arg WRENDNS_BUILD_CHANNEL=dev --build-arg SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)"
          for n in 1 2; do
            docker buildx build --no-cache $args --platform linux/amd64 --target bin --output "type=local,dest=out$n" .
            docker buildx prune -af >/dev/null
          done
          sha256sum out1/wrendns out2/wrendns out1/wrendns.debug out2/wrendns.debug
          # REQ: OPS-013 — the debug file is rebuilt the same way; a difference is reported, not failed.
          cmp -s out1/wrendns.debug out2/wrendns.debug \
            || echo "::warning::the debug files of two clean builds differ"
          if cmp -s out1/wrendns out2/wrendns; then
            echo "## Reproducible: two clean builds of ${GITHUB_SHA::7} are identical" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::two clean builds of the same commit differ ($(cmp -l out1/wrendns out2/wrendns | wc -l) bytes)"
            exit 1
          fi

  # REQ: CLU-001..005, OPS-007 — the three-node test cluster, every night (deploy/cluster3, T21.5).
  # The job is the reusable workflow main.yml calls when the cluster code changes.
  three-node:
    if: github.event.schedule != '17 5 * * 1'
    uses: ./.github/workflows/_cluster3.yml
    permissions:
      contents: read

  # REQ: CLU-004, CLU-005, OPS-001, OPS-010 — the keepalived failover example, every night (deploy/keepalived, T24.4).
  vip-failover:
    if: github.event.schedule != '17 5 * * 1'
    uses: ./.github/workflows/_keepalived.yml
    permissions:
      contents: read

  # REQ: NFR-004 / 09 §4 — fuzzing, 30 minutes per target (ADR-1073).
  fuzz:
    if: github.event.schedule != '17 5 * * 1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [parse_query, parse_response, cache_response, differential, parse_list, qlog_segment, support_redact, snmp_ber, snmp_usm, snmp_walk, http1_response]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { workspaces: fuzz }
      - run: cargo install cargo-fuzz --locked
      - name: Restore corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        working-directory: fuzz
        # +nightly: rust-toolchain.toml pins stable for the repository, and the sanitizer
        # flags cargo-fuzz passes need nightly.
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          # A dispatch input is free text: it reaches the shell through the environment and must be a whole number.
          FUZZ_SECONDS: ${{ inputs.seconds || 1800 }}
        run: |
          case "$FUZZ_SECONDS" in
            ''|*[!0-9]*) echo "::error::the fuzz seconds must be a whole number, got '$FUZZ_SECONDS'"; exit 1 ;;
          esac
          cargo +nightly fuzz run "$FUZZ_TARGET" -- -max_total_time="$FUZZ_SECONDS" -max_len=1500
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}

  # REQ: OPS-004 — new security advisories against the locked dependencies, every night: a
  # dependency can become vulnerable with no change in this repository. The same action main.yml's
  # deny job uses, restricted to the advisories check.
  advisories:
    if: github.event.schedule != '17 5 * * 1'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check advisories

  # REQ: FLT-901 (ADR-995 section 3). Weekly live check of the content-category catalog: each source's
  # licence, last push and archived flag against the GitHub API. Opens (or updates) an issue when a
  # source goes stale; never fails a build, because it asks the internet.
  catalog-check:
    if: github.event.schedule == '17 5 * * 1' || inputs.weekly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the sources
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/check-catalog.py > catalog-report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat catalog-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open an issue when a source is stale
        if: steps.check.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --label catalog --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file catalog-report.md
          else
            gh issue create --title "Content-category catalog: a source needs attention" --label catalog --body-file catalog-report.md
          fi

  # REQ: DOC-006 — the privacy check over everything the repository serves, not only the tree the
  # pull request job reads: the history of every ref (branches, tags and the `refs/pull/*` refs
  # GitHub keeps for every pull request), the tree with the built site, and the files of the `edge`
  # release with the printable strings of its binaries and debug files. The list is a repository
  # secret that nobody needs to hold: a hit is printed as `path:line: pattern #N`, never as the
  # pattern or the matched text (scripts/check-private.py). Only on the project's own repository:
  # a fork has no list.
  privacy-full:
    if: github.event.schedule != '17 5 * * 1' && github.repository == 'nbacheller/wrendns'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Fetch every ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --quiet --no-tags --prune "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            '+refs/heads/*:refs/remotes/origin/*' '+refs/pull/*:refs/remotes/origin/pull/*' '+refs/tags/*:refs/tags/*'
          echo "refs: $(git for-each-ref | wc -l), of them pull request refs: $(git for-each-ref refs/remotes/origin/pull | wc -l)"
          echo "commits: $(git rev-list --all --count)"
      - name: The history of every ref
        env:
          WRENDNS_PRIVACY_DENYLIST_TEXT: ${{ secrets.PRIVACY_DENYLIST }}
        run: python3 scripts/check-private.py --history --require
      - name: The tree, with the built site
        env:
          WRENDNS_PRIVACY_DENYLIST_TEXT: ${{ secrets.PRIVACY_DENYLIST }}
        run: |
          python3 site/build.py
          python3 scripts/check-private.py --require
      - name: The edge release's files
        env:
          GH_TOKEN: ${{ github.token }}
          WRENDNS_PRIVACY_DENYLIST_TEXT: ${{ secrets.PRIVACY_DENYLIST }}
        run: |
          set -o pipefail
          scan="$RUNNER_TEMP/asset-scan"
          mkdir -p "$scan/assets-text"
          # The scan lists files with `git ls-files`, so its root is a repository.
          git -C "$scan" init -q
          gh release download edge -R "$GITHUB_REPOSITORY" -D "$scan/assets"
          ls -l "$scan/assets"
          # Binaries and debug files are not text: scan their printable strings (build paths).
          for f in "$scan"/assets/*.debug.zst; do
            zstd -dc "$f" | strings > "$scan/assets-text/$(basename "$f").txt"
          done
          for f in "$scan"/assets/*-linux; do
            strings "$f" > "$scan/assets-text/$(basename "$f").txt"
          done
          python3 scripts/check-private.py --root "$scan" --require --extra assets --extra assets-text

  # One issue for a failed nightly or weekly run. When a scheduled run fails, an open issue titled
  # "Nightly run failed" gets a comment with the run and the failed jobs, or the issue is created if
  # none is open. When a run is green and such an issue is open, it gets a comment saying so; it is
  # closed by hand. The verdict is scripts/pr_ok.py's: a job that failed, was cancelled or has no
  # readable result counts as failed, and a skipped job (the weekly jobs on a nightly run) as passed.
  report:
    needs: [presets-online, lists-online, coverage, reproducible, three-node, vip-failover, fuzz, advisories, catalog-check, privacy-full]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open, update or note the issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          TITLE: Nightly run failed
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set +e
          verdict=$(python3 scripts/pr_ok.py 2>&1)
          status=$?
          set -e
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # The weekly cron skips the nightly jobs, so only the nightly cron's pass can mean
          # "green again", and only when at least one needed job really succeeded.
          kind="nightly"
          [ "$SCHEDULE" = "17 5 * * 1" ] && kind="weekly"
          succeeded=$(python3 -c 'import json,os; print(sum(1 for j in json.loads(os.environ["NEEDS_JSON"]).values() if j.get("result") == "success"))')
          existing=$(gh issue list --state open --limit 200 --json number,title \
            --jq '[.[] | select(.title == env.TITLE)] | .[0].number // empty')
          if [ "$status" -ne 0 ]; then
            {
              echo "The scheduled $kind run failed: $run_url"
              echo
              echo "Jobs that did not pass (the verdict of scripts/pr_ok.py):"
              echo
              printf '%s\n' "$verdict" | sed 's/^/- /'
            } > report.md
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body-file report.md
            else
              gh issue create --title "$TITLE" --body-file report.md
            fi
          elif [ -n "$existing" ] && [ "$kind" = "nightly" ] && [ "$succeeded" -gt 0 ]; then
            gh issue comment "$existing" --body "The scheduled run is green again: $run_url. Close this issue when the cause is understood."
          else
            echo "Nothing to report: no failure, and either no open issue titled \"$TITLE\", or a weekly run, or no job succeeded."
          fi
