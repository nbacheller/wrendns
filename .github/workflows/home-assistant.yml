# REQ: T22.4 — the Home Assistant integration's tests against a real WrenDNS build and a
# real Home Assistant core (fork addition).
name: home-assistant
on:
  push:
    branches: [main, feat/ipam-integrations]
    paths: ["integrations/home-assistant/**", "crates/wrendns/src/routers.rs", "crates/wrendns/src/device_dns.rs", "deploy/ha-test/**", "crates/wrendns-api/src/pihole_api.rs", ".github/workflows/home-assistant.yml"]
  pull_request:
    paths: ["integrations/home-assistant/**", "crates/wrendns/src/routers.rs", "crates/wrendns/src/device_dns.rs", "deploy/ha-test/**", "crates/wrendns-api/src/pihole_api.rs", ".github/workflows/home-assistant.yml"]
  workflow_dispatch:
# A newer push to the same branch supersedes a run still in progress (it would only spend minutes and
# the shared GitHub API limit); runs on main are never cancelled, the release workflow waits on them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
jobs:
  test:
    # OPS-004: the self-hosted runners when the repo variable names them (trusted events; pull
    # requests only while WRENDNS_PR_RUNNER is set, never from forks), else GitHub-hosted.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && (!github.event.pull_request.head.repo.fork && vars.WRENDNS_PR_RUNNER || '"ubuntu-latest"') || vars.WRENDNS_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build WrenDNS (debug)
        run: cargo build -p wrendns
      - name: Install Home Assistant's test harness
        run: pip install pytest-homeassistant-custom-component ruff
      - name: Lint
        working-directory: integrations/home-assistant
        run: ruff check custom_components tests && ruff format --check custom_components tests
      - name: Test
        working-directory: integrations/home-assistant
        run: pytest -q -p no:cacheprovider
  # REQ: T24.21 — the WrenDNS Home Assistant source and integration against a throwaway
  # Home Assistant (deploy/ha-test): devices named and addressed, the names in DNS, the sensors;
  # T24.10: and the Home Assistant Pi-hole integration against the Pi-hole compatible API.
  ha-test:
    # OPS-004: the self-hosted runners when the repo variable names them (trusted events; pull
    # requests only while WRENDNS_PR_RUNNER is set, never from forks), else GitHub-hosted.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && (!github.event.pull_request.head.repo.fork && vars.WRENDNS_PR_RUNNER || '"ubuntu-latest"') || vars.WRENDNS_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
      - run: cargo build -p wrendns
      - name: Home Assistant source against a throwaway Home Assistant
        run: bash deploy/ha-test/e2e.sh target/debug/wrendns
