# REQ: OPS-004, NFR-005 (ADR-1073) — the fast tier every pull request gets. `pr-ok` is the one
# required check; the full tier (main.yml) runs on main, on dispatch, and on a
# pull request that carries the `ci:full` label.
name: pr
on:
  pull_request:
  workflow_dispatch:
# A newer push to the same branch supersedes a run still in progress (it would only spend minutes and
# the shared GitHub API limit).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege (OPS-004, ADR-1080): no permissions at the workflow level; every job sets its own,
# `contents: read` unless it says more.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # What did the pull request change? scripts/pr_changes.py classifies each changed path; a path it
  # does not know runs the tests (deny by default). A diff that cannot be computed, or an empty one,
  # fails the job: it never reads as "nothing changed". Only the base commit's SHA (a hex string)
  # reaches the shell, through `env:`.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      ui: ${{ steps.diff.outputs.ui }}
      native: ${{ steps.diff.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Full history, so that the base commit is reachable and the two can be diffed.
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Which parts changed
        id: diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            python3 scripts/pr_changes.py --all | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$BASE_SHA" ]; then
            echo "::error title=changes::the pull request's base commit is unknown, so the diff cannot be computed"
            exit 1
          fi
          # HEAD is the merge of the pull request into its base: base..HEAD is the pull request's
          # own change. -z lists NUL-separated, unquoted paths; --no-renames lists both sides of a
          # rename. A failed diff or script stops here (pipefail), and an empty diff is an error.
          git -c core.quotePath=false diff -z --name-only --no-renames "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed.z"
          echo "Changed paths:"
          tr '\0' '\n' < "$RUNNER_TEMP/changed.z"
          python3 scripts/pr_changes.py < "$RUNNER_TEMP/changed.z" | tee -a "$GITHUB_OUTPUT"

  fmt:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
        with: { toolchain: "1.99.0", components: rustfmt }
      - run: cargo fmt --all --check

  clippy:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # OPS-004: the self-hosted runners when the repo variable names them (trusted events; pull
    # requests only while WRENDNS_PR_RUNNER is set, never from forks or Dependabot: they build third-party code), else GitHub-hosted.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && vars.WRENDNS_PR_RUNNER || '"ubuntu-latest"') || vars.WRENDNS_RUNNER || '"ubuntu-latest"') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
        with: { toolchain: "1.99.0", components: clippy }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.environment == 'github-hosted'
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The amd64 leg only: the arm64 leg stays in the full tier.
  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # OPS-004: the self-hosted runners when the repo variable names them (trusted events; pull
    # requests only while WRENDNS_PR_RUNNER is set, never from forks or Dependabot: they build third-party code), else GitHub-hosted.
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && vars.WRENDNS_PR_RUNNER || '"ubuntu-latest"') || vars.WRENDNS_RUNNER || '"ubuntu-latest"') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.environment == 'github-hosted'
      - name: cargo test --workspace
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee "$RUNNER_TEMP/test.log"
      # REQ: API-902 (T27.13) - the guarded framework's tests that need the e2e test rows (the other
      # tests, including the release-build checks, run in the step above).
      - name: cargo test (feature e2e)
        run: cargo test -p wrendns-config -p wrendns-api -p wrendns --features wrendns/e2e,wrendns-config/e2e guarded
      # REQ: CLU-005 — T5.4b AC: the election simulator's 10,000 partition schedules.
      - name: wrendns-sim (10k schedules, release)
        shell: bash
        run: |
          set -o pipefail
          cargo test --release -p wrendns-cluster --test sim -- --nocapture 2>&1 | tee -a "$RUNNER_TEMP/test.log"
      # Job logs need a token to read; annotations don't. Surface failing tests there.
      - name: Annotate failing tests
        if: failure()
        shell: bash
        run: |
          grep -E "panicked at|^test .* \.\.\. FAILED|^    [a-z0-9_]+(::[a-z0-9_]+)+$" "$RUNNER_TEMP/test.log" \
            | head -20 | while IFS= read -r line; do echo "::error title=test failure::$line"; done

  deny:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3

  # REQ: DOC-004/005 — the site builds, links resolve, and Standards covers ticked tasks. The
  # privacy check is its own job below, so that its result is a check of its own.
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The SPDX check compares against the permissive-final tag, so it needs the history and tags.
        with: { persist-credentials: false, fetch-depth: 0, fetch-tags: true }
      - run: python3 site/build.py --check
      # REQ: ADR-1033, ADR-1035 — every source file added since permissive-final carries the AGPL
      # SPDX header (old files are not mass-edited).
      - run: python3 scripts/test_check_spdx.py
      - run: python3 scripts/check-spdx.py
      # REQ: OPS-004 — no echo or printf piped into grep -q (fails under pipefail on large output).
      - run: python3 scripts/test_check_pipefail.py
      - run: python3 scripts/check-pipefail.py
      # REQ: OPS-004, NFR-005 (ADR-1080) — actions pinned by commit SHA, checkouts without kept credentials,
      # job-level permissions, no untrusted expression in a script body.
      - run: python3 scripts/test_check_workflows.py
      - run: python3 scripts/check-workflows.py
      # REQ: NFR-005 (ADR-1080) — zizmor audits the workflows. Pinned by version and by hash; offline,
      # so the result does not depend on a token or on the network after the install. The findings
      # accepted on purpose, each with its reason, are in .github/zizmor.yml.
      - name: zizmor (workflow audit)
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor-venv"
          {
            echo "zizmor==1.33.1 \\"
            echo "  --hash=sha256:49eb92a95347e7da58c3123e4d5b297dbb6fe8ecc328e9db68df14c08e25e151 \\"
            echo "  --hash=sha256:0927b0f2f86d67a98444ae7fe2529963e29ffc3acff73e588f479f33361c926c"
          } > "$RUNNER_TEMP/zizmor-requirements.txt"
          "$RUNNER_TEMP/zizmor-venv/bin/pip" install --quiet --require-hashes --only-binary :all: -r "$RUNNER_TEMP/zizmor-requirements.txt"
          "$RUNNER_TEMP/zizmor-venv/bin/zizmor" --offline --no-progress --config .github/zizmor.yml .github/workflows
      # REQ: OPS-004 (ADR-1073) — pr-ok fails on a failed, cancelled or unknown job result and on bad input.
      - run: python3 scripts/test_pr_ok.py
      # REQ: OPS-004 (ADR-1073) — the changes job's classification: unknown paths run the tests.
      - run: python3 scripts/test_pr_changes.py
      # REQ: OBS-005 — the Grafana dashboard is regenerated from deploy/grafana/build.py.
      - run: python3 deploy/grafana/build.py --check
      # T10.6 — every P0 requirement has tests or evidence, and docs/v1-requirements.md is current.
      - run: python3 spec/trace.py --check

  # REQ: DOC-006 — no tracked file, built site page or generated doc names anything on the
  # maintainers' private denylist. The list is the repository secret PRIVACY_DENYLIST. In the
  # maintainers' own repository (nbacheller/wrendns) the list is required and a missing secret fails
  # the job. That includes a pull request from a fork: it gets no secret, so the script exits 2 and
  # the check fails closed (owner decision, 2026-11-20; ADR-1080). A contributor who sees that
  # failure has done nothing wrong: a maintainer reviews the change, pushes the commits (authorship
  # kept) to a branch of this repository, where every check runs, merges that, and closes the fork
  # pull request with a link. No check is bypassed (docs/going-public.md step 32). Dependabot's pull requests are scanned like any other: they get
  # Dependabot secrets only, so the list is also stored as the Dependabot secret of the same name
  # (owner decision, 2026-11-20), and a missing one fails the job.
  # Hits name file:line and the pattern's number, never the pattern. A repository other than
  # nbacheller/wrendns (a fork's own Actions) skips with a notice.
  privacy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The scan reads the tracked files; history and tags as the site job has them.
        with: { persist-credentials: false, fetch-depth: 0, fetch-tags: true }
      - run: python3 scripts/test_check_private.py
      # The built site is scanned too.
      - run: python3 site/build.py
      - run: python3 scripts/check-private.py
        env:
          WRENDNS_PRIVACY_DENYLIST_TEXT: ${{ secrets.PRIVACY_DENYLIST }}
          WRENDNS_PRIVACY_REQUIRED: ${{ github.repository == 'nbacheller/wrendns' }}

  # REQ: API-005 — T3.9 AC: the UI type-checks, its API types match docs/api/openapi.json,
  # the bundle stays within 400 KiB gzipped, and the Playwright suite passes against the
  # real binary.
  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    # OPS-004: GitHub-hosted until each self-hosted runner has its own network namespace (this
    # job binds fixed host ports, which concurrent jobs on one host would share).
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: API types match the OpenAPI document
        run: npm run types && git diff --exit-code src/lib/api-types.ts
      # REQ: AGT-001 (T6.5) — the OpenAPI document is agent-ready (.spectral.yaml).
      - name: OpenAPI lint (spectral)
        run: npx -y @stoplight/spectral-cli@6 lint ../docs/api/openapi.json --ruleset ../.spectral.yaml --fail-severity=warn
      - run: npm run check
      # REQ: API-011 — every "?" in the UI has a glossary topic and every topic is used.
      - run: npm run check:help
      - name: Build (fails over the size budget)
        run: npm run build
      - uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.environment == 'github-hosted'
      # REQ: API-902 (T27.13) - the e2e server has the guarded framework's test rows and restart hook
      # (the cargo feature `e2e`, never in a release build).
      - run: cargo build -p wrendns --features e2e
        working-directory: .
      - run: npx playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} --only-shell chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report
          if-no-files-found: ignore

  # REQ: OPS-004 — the Pi/Linux paths on a disposable runner: the Compose bundle (host network,
  # healthcheck, hardening) and install.sh + the systemd unit (signed fake release, DNS on port 53,
  # upgrade in place, tampered releases refused). The cluster e2e scripts stay in the full tier.
  native-lite:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@92e73e19cbfb3981e63ef478a16f95f415e634d3 # 1.99.0
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.environment == 'github-hosted'
      # `wedge-test` is the watchdog e2e's hook (OPS-012): inert without WRENDNS_WEDGE_AFTER_SECS.
      - run: cargo build --profile bench-fast -p wrendns --features wedge-test
      - name: Compose bundle
        run: |
          sh .github/scripts/apt-install.sh dnsutils minisign
          mkdir ctx && cp target/bench-fast/wrendns ctx/
          printf '%s\n' 'FROM ubuntu:24.04' \
            'COPY wrendns /usr/local/bin/wrendns' \
            'RUN mkdir -p /var/lib/wrendns /etc/wrendns && chown 65532:65532 /var/lib/wrendns' \
            'ENTRYPOINT ["/usr/local/bin/wrendns"]' 'CMD ["run"]' > ctx/Dockerfile
          docker build -q -t wrendns:ci ctx
          bash deploy/compose/e2e.sh wrendns:ci
      # REQ: OPS-001 (T7.6 AC) — the guided installer's answers produce configs that pass
      # `config check`; Enter gives the starter config; no questions without a terminal.
      - name: install.sh guided setup (answers on stdin)
        run: bash deploy/systemd/guided-e2e.sh target/bench-fast/wrendns
      - name: install.sh + systemd unit
        run: sudo bash deploy/systemd/e2e.sh target/bench-fast/wrendns
      # REQ: OPS-004 (ADR-1028, T33.2) — the migration of a pre-rename native install (a fake root;
      # no root or systemd needed).
      - name: pre-rename install migration
        run: sh deploy/systemd/tests/migrate-test.sh

  # REQ: NFR-005 (ADR-1080) — a pull request that adds or bumps a dependency with a known
  # vulnerability fails here. GitHub's dependency review needs the dependency graph and, on a private
  # repository, GitHub Advanced Security, which this repository does not have: so the job runs only
  # while the repository is public (it switches itself on at the public flip; until then it is
  # skipped, and a skipped job passes pr-ok). `private == false` is false when the payload lacks the
  # field, so an unknown visibility also skips.
  dependency-review:
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  # The one required check. It needs every other job in this file, so a failure anywhere is a
  # failure here; it runs even when a needed job failed or was skipped (`if: always()`), and
  # scripts/pr_ok.py passes only when no needed job failed, was cancelled or has an unknown result.
  # A job skipped because its dependency failed is covered because that dependency is itself in
  # `needs`: if `changes` fails, fmt, clippy, test, deny, ui and native-lite are all skipped, and
  # `changes` still fails pr-ok. Jobs covered: changes, fmt, clippy, test, deny, site, privacy, ui,
  # native-lite and dependency-review. Add every new job to `needs`.
  pr-ok:
    needs: [changes, fmt, clippy, test, deny, site, privacy, ui, native-lite, dependency-review]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every needed job passed or was skipped
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/pr_ok.py
