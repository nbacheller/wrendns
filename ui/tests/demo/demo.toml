# The screenshot demo (run.sh): a made-up home network on loopback addresses. Nothing here is
# real: devices, groups, and names are invented, the upstreams are local stubs (stub.py), and the
# UniFi gateway is a stub too (unifi.py). This node, pi-01, creates the cluster that the two
# replicas (demo-pi-02.toml, demo-k8s-a.toml) join, so the Cluster page shows three real nodes.
[node]
data_dir = "/tmp/wrendns-demo/data"
name = "pi-01"
# The stub gateway's made-up API key is written here by run.sh (it is not a real credential).
secret_file_dirs = ["/tmp/wrendns-demo/secrets"]

[[listen]]
proto = "udp"
addr = "127.0.0.1:25353"

[[upstream]]
name = "quad9"
url = "udp://127.0.0.1:25401"

[[upstream]]
name = "cloudflare"
url = "udp://127.0.0.1:25402"

[[upstream_group]]
name = "default"
members = ["quad9", "cloudflare"]
strategy = "fastest"

[[group]]
name = "Family"
networks = ["127.0.1.0/24"]

[[group]]
name = "Kids"
networks = ["127.0.2.0/24"]

[[group]]
name = "IoT"
networks = ["127.0.3.0/24"]

[[group]]
name = "Work"
networks = ["127.0.4.0/24"]

[[client]]
name = "Mom's Phone"
match = ["127.0.1.11"]

[[client]]
name = "Dad's Laptop"
match = ["127.0.4.30"]

[[client]]
name = "Ava's iPad"
match = ["127.0.2.10"]

[[client]]
name = "Gaming PC"
match = ["127.0.2.12"]

[[client]]
name = "Living Room TV"
match = ["127.0.3.20"]

[[client]]
name = "Thermostat"
match = ["127.0.3.21"]

[[client]]
name = "Kitchen Speaker"
match = ["127.0.3.22"]

[[list]]
name = "ads-and-trackers"
rules = [
  "||doubleclick.net^",
  "||googlesyndication.com^",
  "||app-measurement.com^",
  "||ads.example.com^",
  "||telemetry.example.net^",
  "||telemetry.climate.example^",
  "||metrics.tv-vendor.example^",
  "||tracker.example.org^",
]

[[record]]
name = "nas.home.arpa"
type = "A"
value = "10.20.0.10"

[telemetry.metrics]
listen = "127.0.0.1:29154"

[telemetry.qlog]
flush_interval_secs = 1

[api]
listen = "127.0.0.1:28053"

# REQ: CLU-001 — the cluster, on loopback only (made by this node on its first start).
[cluster]
name = "home"
site = "pi-01"
eligible = true
listen = "127.0.0.1:28443"

[cluster.init]
advertise = ["https://127.0.0.1:28443"]

# REQ: API-013, DSC-901 — a made-up UniFi gateway (unifi.py): device names, MACs and the networks,
# so the CMDB has more than one source to reconcile for each device.
[[router]]
name = "gateway"
type = "unifi"
url = "http://127.0.0.1:25480"
api_key_file = "/tmp/wrendns-demo/secrets/unifi-key"
interval_secs = 30

[cmdb]
enabled = true
