[package]
name = "telltale-support"
description = "The support package's pure core: a tar.gz writer, keyed pseudonyms, configuration classification, and text redaction (ADR-156)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
telltale-config.workspace = true
# REQ: OPS-011 (ADR-156) — pseudonyms are a keyed BLAKE3 function of the address prefix (Crypto-PAn
# style); the archive is deflate by miniz_oxide (pure Rust, already used for Git packfiles); the
# known-values pass is one multi-pattern regex-automata search (already used by the filter).
blake3 = "1.8.7"
miniz_oxide = "0.8"
regex-automata = "0.4.18"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
