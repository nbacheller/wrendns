[package]
name = "telltale-api"
description = "REST API, auth, OpenAPI, live tail, and embedded UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
base64 = "0.23.1"
# The live tail's SSE stream (already in the tree via axum).
futures-util = { version = "0.3", default-features = false }
blake3 = "1.8.7"
# REQ: NFR-001 (ADR-168) — the embedded UI keeps only its `.gz` files; a client that doesn't accept
# gzip gets them inflated. Already in the tree (telltale-git, telltale-support, telltale).
miniz_oxide = "0.8.9"
rand = "0.10.3"
# REQ: API-004 (ADR-951) — OIDC signature checks: RSA, ECDSA and Ed25519 verification. Already in
# the tree through rustls and rcgen, so this is a direct edge, not a new crate.
ring = "0.17.14"
rust-embed = { version = "8.12.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# REQ: API-014 (ADR-903 §4) — the credential table, to show plans' write bodies redacted.
telltale-config = { version = "0.8.0", path = "../telltale-config" }
telltale-store = { version = "0.8.0", path = "../telltale-store" }
# REQ: OBS-017 — trace IDs (already a dependency of telltale-store).
telltale-telemetry = { version = "0.8.0", path = "../telltale-telemetry" }
tokio = { version = "1.53.2", features = ["rt", "sync", "time"] }
tracing = "0.1"
totp-rs = { version = "6.0.0", default-features = false, features = ["std"] }
# REQ: AGT-006 (ADR-065) — MCP tools call the REST routes in-process (already in the tree via
# axum).
tower = { version = "0.5.3", default-features = false, features = ["util"] }
# REQ: API-015 (ADR-903) — a secret's value is wiped once it leaves the request (already in the
# tree through argon2 and rustls; a direct edge, no new crate).
zeroize = "1.9.0"
utoipa = { version = "6.0.0", features = ["macros"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["rt", "macros"] }
