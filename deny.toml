# REQ: NFR-005 — supply-chain checks. AGENTS.md rule 6: permissive licenses only (no copyleft).
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2023-0071 (rsa, "Marvin attack"): timing side channel in RSA private-key
    # operations (PKCS#1 v1.5 decryption, signing). `rsa` arrives through `openidconnect`
    # (OIDC sign-in, API-004), where TelltaleDNS only *verifies* ID-token signatures with the
    # provider's public keys: it holds no RSA private key to leak. No fixed version exists
    # yet. Revisit when one does (ADR-034).
    { id = "RUSTSEC-2023-0071", reason = "rsa is used for public-key signature verification only (OIDC ID tokens); no private keys" },
    # RUSTSEC-2026-0543 (chrono, "unmaintained"): a notice, not a vulnerability: the advisory
    # says every version is affected and offers no safe upgrade. `chrono` arrives through
    # `oauth2` and `openidconnect` (OIDC sign-in, API-004), which use it for the times in tokens
    # and ID-token claims; `telltale-api` uses it directly only in its tests. Revisit when those
    # crates move to another time crate (the advisory suggests jiff or time) or a maintained
    # chrono appears.
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained (informational, no vulnerability); used by oauth2/openidconnect for token times, and in tests; no safe upgrade exists" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
