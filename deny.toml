# REQ: NFR-005 — supply-chain checks. AGENTS.md rule 6: permissive licenses only (no copyleft).
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# REQ: API-004 (ADR-952) — no advisory is ignored. The two that the OIDC library brought in
# (RUSTSEC-2023-0071 for rsa, RUSTSEC-2026-0543 for chrono) left the tree with the in-tree OIDC
# verifier (ADR-951), so their ignores were removed rather than kept with stale reasons.
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
