# TelltaleDNS content-category catalog: Adult and Sensitive Content (REQ: FLT-901, ADR-995).
# Data, not code: compiled into the binary. Lists are never bundled: a node downloads
# each source from its maintainer only while a group uses it.

[[group]]
id = "adult"
name = "Adult and Sensitive Content"
order = 1

[[category]]
id = "adult"
name = "Adult content"
group = "adult"
description = "Pornography and sexually explicit sites. A DNS block: it stops names, not pages, and a device on mobile data or a VPN is not covered."
sources = ["hagezi-nsfw"]
tier_kind = "additive"
[[category.tier]]
id = "extended"
name = "Extended (adds Bon-Appetit)"
sources = ["bonappetit-porn"]

[[category]]
id = "gambling"
name = "Gambling"
group = "adult"
description = "Casinos, betting and lottery sites."
