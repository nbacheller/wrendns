# TelltaleDNS content-category catalog: the version, the presets and the measured sizes
# (REQ: FLT-901, ADR-995). Data, not code: compiled into the binary.

# The day the sources were last checked (licence, a push within 90 days, not archived). The
# recorded-metadata tests compare each source's `checked` and `pushed` dates with this day, never
# with the clock, so a stale catalog fails the weekly job (scripts/check-catalog.py) and not an
# unrelated build.
catalog_version = "2026-11-18"

# What "Basic" means in a profile (`level = "basic"`, ADR-994 owner decision 2).
[[preset]]
id = "basic"
name = "Basic"
description = "Adult content, malware, phishing and scams. Nothing else is blocked."
categories = ["adult", "malware", "phishing", "scam"]

# Measured by `docs/design/content-categories.md` section 2.4 (T24.29 step 2). The budget rule
# reads these, never a number written in code.
[measured]
# Resident set of a node with no category list, in bytes.
baseline_rss_bytes = 33554432
# Snapshot bytes per distinct domain.
bytes_per_domain = 12
# Compile peak = min(source bytes x factor, the merge budget). Measured 2026-11-18 (design 2.4):
# 2.8x to 5x of the source text on a 4-CPU stand-in; 4.0 is the conservative figure.
compile_peak_factor = 4.0
# A source above this many entries is "heavy".
heavy_threshold = 500000
# Refresh of a light and of a heavy source, seconds (8 hours; 24 hours).
light_refresh_secs = 28800
heavy_refresh_secs = 86400
