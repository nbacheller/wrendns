# Categories the catalog does not offer, and why (REQ: FLT-901, ADR-994 item 4: no empty
# checkboxes). The Categories view ends with a collapsed "Not available" section made from this
# file. Two reasons are used: no open maintained list is known, or the only source is a
# third-party mirror of the UT1 blacklists whose upstream licence is not yet verified (ADR-995
# section 3, design question 4, decided "later").

