# TelltaleDNS content-category catalog: New or Risky Domains (REQ: FLT-901, ADR-995).
# Data, not code: compiled into the binary. Lists are never bundled: a node downloads
# each source from its maintainer only while a group uses it.

[[group]]
id = "risky"
name = "New or Risky Domains"
order = 6

[[category]]
id = "nrd"
name = "Newly registered domains (7 days)"
group = "risky"
description = "Domains registered in the last 7 days, a favourite of phishing and malware. HaGeZi publishes it as-is, with no guarantees. Heavy: about 2.4 million names."
sources = ["hagezi-nrd7"]

[[category]]
id = "dga"
name = "DGA-like new domains (7 days)"
group = "risky"
description = "Newly registered domains with random-looking names, typical of malware. Offered as-is. Heavy: about 550,000 names."
sources = ["hagezi-dga7"]

[[category]]
id = "fake-stores"
name = "Fake stores and scams"
group = "risky"
description = "Fake web shops and scam sites."
sources = ["hagezi-fake"]

[[category]]
id = "abused-tlds"
name = "Risky top-level domains"
group = "risky"
description = "Blocks whole top-level domains that are mostly abused. Many legitimate sites live under them too. Off by default and never in Basic."
sources = ["hagezi-spam-tlds"]
warn = "This blocks every site under those top-level domains, legitimate ones included."

