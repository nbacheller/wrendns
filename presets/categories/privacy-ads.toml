# WrenDNS content-category catalog: Privacy and Ads (REQ: FLT-901, ADR-995).
# Data, not code: compiled into the binary. Lists are never bundled: a node downloads
# each source from its maintainer only while a group uses it.

[[group]]
id = "privacy"
name = "Privacy and Ads"
order = 8

# The Ad Block checkbox. The size is a Settings value ([filter] ads_tier, default pro). The sources
# name the adblock/ files so the default tier's URL is the one the bundles already use (ADR-995 2b).
[[category]]
id = "ads"
name = "Ad block"
group = "privacy"
description = "Ads, trackers, telemetry and known bad hosts. The size (light, pro, pro++, ultimate) is a Settings choice."
tier_kind = "exclusive"
default_tier = "pro"
tier_from = "ads_tier"
[[category.tier]]
id = "light"
name = "Light"
sources = ["hagezi-ads-light"]
[[category.tier]]
id = "pro"
name = "Pro"
sources = ["hagezi-ads-pro"]
[[category.tier]]
id = "pro-plus"
name = "Pro++"
sources = ["hagezi-ads-pro-plus"]
[[category.tier]]
id = "ultimate"
name = "Ultimate"
sources = ["hagezi-ads-ultimate"]

[[category]]
id = "popup-ads"
name = "Pop-up ads"
group = "privacy"
description = "Pop-up and pop-under advertising networks."
sources = ["hagezi-popupads"]

[[category]]
id = "smart-tv"
name = "Smart-TV trackers"
group = "privacy"
description = "Smart TVs sending data home: Perflyst's smart-TV list plus HaGeZi's LG, Samsung and Roku trackers. Some TV apps and updates may stop working."
sources = ["perflyst-smarttv", "perflyst-amazonfiretv", "hagezi-native-lgwebos", "hagezi-native-samsung", "hagezi-native-roku"]

[[category]]
id = "app-trackers"
name = "App and session-replay trackers"
group = "privacy"
description = "Android tracking hosts and session-replay services (Perflyst)."
sources = ["perflyst-android-tracking", "perflyst-sessionreplay"]

[[category]]
id = "native-trackers"
name = "Device and OS trackers"
group = "privacy"
description = "Built-in trackers of Amazon, Apple, Huawei, LG, Oppo and Realme, Roku, Samsung, TikTok, Vivo, Windows and Office, and Xiaomi (HaGeZi)."
sources = ["hagezi-native-amazon", "hagezi-native-apple", "hagezi-native-huawei", "hagezi-native-lgwebos", "hagezi-native-oppo-realme", "hagezi-native-roku", "hagezi-native-samsung", "hagezi-native-tiktok", "hagezi-native-vivo", "hagezi-native-winoffice", "hagezi-native-xiaomi"]

