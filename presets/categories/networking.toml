# TelltaleDNS content-category catalog: Networking Infrastructure (REQ: FLT-901, ADR-995).
# Data, not code: compiled into the binary. Lists are never bundled: a node downloads
# each source from its maintainer only while a group uses it.

[[group]]
id = "network"
name = "Networking Infrastructure"
order = 5

[[category]]
id = "bypass"
name = "DoH, VPN, Tor and proxy bypass"
group = "network"
description = "Encrypted-DNS, VPN, Tor and proxy services that let a device go around this resolver. It only works together with blocking outbound ports 53 and 853 (see the help topic)."
sources = ["hagezi-doh-vpn-proxy"]

[[category]]
id = "dyndns"
name = "Dynamic DNS"
group = "network"
description = "Dynamic-DNS providers, often used to host things at home or to hide a command server."
sources = ["hagezi-dyndns"]

[[category]]
id = "shorteners"
name = "URL shorteners"
group = "network"
description = "Link shorteners, which hide where a link goes."
sources = ["hagezi-urlshortener"]

[[category]]
id = "hosting"
name = "Hosting providers"
group = "network"
description = "Web hosting and cloud providers. Blocks many legitimate sites that run on them."
sources = ["hagezi-hoster"]

