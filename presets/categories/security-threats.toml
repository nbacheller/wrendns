# TelltaleDNS content-category catalog: Security and Threat Protection (REQ: FLT-901, ADR-995).
# Data, not code: compiled into the binary. Lists are never bundled: a node downloads
# each source from its maintainer only while a group uses it.

[[group]]
id = "security"
name = "Security & Threat Protection"
order = 7

# One threat-intelligence feed backs the three categories; a node downloads it once however many
# are chosen. The tiers are exclusive: exactly one size is used.
[[category]]
id = "malware"
name = "Malware"
group = "security"
description = "Malware, command-and-control and cryptojacking hosts from threat-intelligence feeds."
tier_kind = "exclusive"
default_tier = "mini"
[[category.tier]]
id = "mini"
name = "Mini"
sources = ["hagezi-tif-mini"]
[[category.tier]]
id = "medium"
name = "Medium"
sources = ["hagezi-tif-medium"]
[[category.tier]]
id = "full"
name = "Full (heavy)"
sources = ["hagezi-tif-full"]

