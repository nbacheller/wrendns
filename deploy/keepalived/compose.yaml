# Two TelltaleDNS nodes behind one keepalived VIP (REQ: CLU-004, OPS-001; deploy/keepalived/README.md).
#
#   docker compose up -d
#   dig @10.231.250.10 whoami.vip.home.arpa TXT +short      # from a container on the vip network
#
# Each node is two containers that share one network namespace: keepalived-* owns it (it holds the
# VIP and runs the health check), telltale-* joins it with `network_mode: service:keepalived-*`. So
# the VIP lands on the node that is healthy, and the node's wildcard DNS listener answers on it.
# The network is an isolated bridge with no route out (`internal`); this file proves the failover on
# it. On a LAN, use the runbook in docs/running.md ("Failover with a VIP") instead: the same two
# services with the VIP on the LAN subnet, with keepalived and telltale on the host or a macvlan.
#
# Nothing here publishes a host port: the DNS and the API are reachable on the vip network only.
# The e2e test (e2e.sh) builds the image and runs the whole failover; it never touches the LAN.
name: telltale-keepalived

x-telltale: &telltale
  # Set TELLTALE_IMAGE to a local build (e2e.sh does); otherwise the published image is pulled.
  image: ${TELLTALE_IMAGE:-ghcr.io/paimonsoror/telltale:${TELLTALE_TAG:-latest}}
  pull_policy: missing
  restart: "no"
  command: ["run", "-c", "/etc/telltale/telltale.toml"]
  # The image's unprivileged user, with no capabilities. Port 53 is allowed by the sysctl the
  # keepalived service sets for the shared network namespace (see there and README.md).
  user: "65532:65532"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  environment:
    TELLTALE_LOG: info
  healthcheck:
    test: ["CMD", "/usr/local/bin/telltale", "health", "--url", "http://127.0.0.1:8053/readyz"]
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 10s

x-keepalived: &keepalived
  build:
    context: .
    dockerfile: Dockerfile
  image: telltale-keepalived:alpine-3.20
  pull_policy: build
  restart: "no"
  # keepalived needs to add and remove the VIP, send adverts, and run its check as root (setgroups
  # and setuid for the script, which keepalived calls on every run). Nothing else.
  cap_drop: [ALL]
  cap_add: [NET_ADMIN, NET_BROADCAST, NET_RAW, SETUID, SETGID]
  security_opt: ["no-new-privileges:true"]
  networks:
    vip:

services:
  keepalived-a:
    <<: *keepalived
    # The network namespace is shared with telltale-a, so this sysctl lets the unprivileged node
    # bind port 53 (the same setting as the Pi docs use on the host, net.ipv4.ip_unprivileged_port_start).
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    networks:
      vip:
        ipv4_address: 10.231.250.11
    volumes:
      - ./keepalived/node-a.conf:/etc/keepalived/keepalived.conf:ro

  telltale-a:
    <<: *telltale
    network_mode: "service:keepalived-a"
    depends_on:
      - keepalived-a
    volumes:
      - ./config/node-a.toml:/etc/telltale/telltale.toml:ro
      - telltale-a-data:/var/lib/telltale

  keepalived-b:
    <<: *keepalived
    # The network namespace is shared with telltale-b, so this sysctl lets the unprivileged node
    # bind port 53 (the same setting as the Pi docs use on the host, net.ipv4.ip_unprivileged_port_start).
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    networks:
      vip:
        ipv4_address: 10.231.250.12
    volumes:
      - ./keepalived/node-b.conf:/etc/keepalived/keepalived.conf:ro

  telltale-b:
    <<: *telltale
    network_mode: "service:keepalived-b"
    depends_on:
      - keepalived-b
    volumes:
      - ./config/node-b.toml:/etc/telltale/telltale.toml:ro
      - telltale-b-data:/var/lib/telltale

  # The witness of the cluster (CLU-005): a vote-only process, started with `--profile witness` after it
  # has joined (README.md). It has no DNS listener, no API and no VIP; it only votes on promotion.
  telltale-witness:
    image: ${TELLTALE_IMAGE:-ghcr.io/paimonsoror/telltale:${TELLTALE_TAG:-latest}}
    pull_policy: missing
    profiles: [witness]
    restart: "no"
    command: ["cluster", "witness", "-c", "/etc/telltale/telltale.toml"]
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    networks:
      vip:
        ipv4_address: 10.231.250.13
    volumes:
      - ./config/witness.toml:/etc/telltale/telltale.toml:ro
      - witness-data:/var/lib/telltale

networks:
  vip:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.231.250.0/24

volumes:
  telltale-a-data:
  telltale-b-data:
  witness-data:
