# The second TelltaleDNS node behind the keepalived VIP (deploy/keepalived, REQ: CLU-004). It is the
# same as node a except for [node] name and [cluster] site, and it has no [cluster.init]: it joins
# node a's cluster with a token (README.md). Until it has joined it runs as a standalone node.
config_version = 1

[node]
name = "telltale-b"

[[listen]]
proto = "udp"
addr = "0.0.0.0:53"

[[listen]]
proto = "tcp"
addr = "0.0.0.0:53"

[api]
listen = "0.0.0.0:8053"

[dns]
nsid = true

[cluster]
name = "keepalived"
site = "telltale-b"
listen = "0.0.0.0:8443"

[[record]]
name = "gateway.vip.home.arpa"
type = "A"
value = "192.0.2.1"
