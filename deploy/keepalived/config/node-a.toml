# One of the two TelltaleDNS nodes behind the keepalived VIP (deploy/keepalived, REQ: CLU-004).
# The two files differ only in [node] name, [cluster] site and [cluster.init] (node a creates the
# cluster on its first start; node b joins it with a token, see deploy/keepalived/README.md). The
# DNS listeners bind the wildcard address, so they answer on the VIP the node holds and on its own
# address. Every shared setting stays identical on both nodes.
#
# This example has no upstream resolvers: the test network has no internet. Add [[upstream]] and
# [[upstream_group]] (see deploy/compose/telltale.toml) for a real node.
config_version = 1

[node]
name = "telltale-a"

[[listen]]
proto = "udp"
addr = "0.0.0.0:53"

[[listen]]
proto = "tcp"
addr = "0.0.0.0:53"

[api]
listen = "0.0.0.0:8053"

# Each answer names the node that gave it in the NSID option: `dig +nsid @VIP ...` shows which
# node holds the VIP (the answer's name is `[node] name`).
[dns]
nsid = true

[cluster]
name = "keepalived"
site = "telltale-a"
listen = "0.0.0.0:8443"

[cluster.init]
advertise = ["https://10.231.250.11:8443"]

[[record]]
name = "gateway.vip.home.arpa"
type = "A"
value = "192.0.2.1"
