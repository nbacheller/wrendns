# keepalived for telltale-b (REQ: CLU-004). Both nodes run the same VRRP instance on the VIP
# 10.231.250.10. node-b has the lower priority: it holds the VIP only while node-a is down or failing.
# Unicast (no multicast on the Docker bridge): each node sends its adverts to the other.
global_defs {
    router_id telltale-b
    vrrp_skip_check_adv_addr
    # The health check is the one script; it runs as root (it only reads the node's own endpoints).
    enable_script_security
    script_user root
}

vrrp_script chk_telltale {
    script "/usr/local/bin/check-telltale.sh"
    interval 2
    timeout 5
    fall 2
    rise 2
    # A failing node drops below its peer (100 - 60 = 40 < 150), so the peer keeps or takes the VIP.
    weight -60
}

vrrp_instance DNS_VIP {
    state BACKUP
    # keepalived needs the interface's name; the container's start script puts it in, found from
    # the address this node has on that network (the names depend on how Docker attached them).
    # On a real node write the name: eth0 for the untagged LAN, eth0.100 for VLAN 100.
    interface @iface:10.231.250.12@
    virtual_router_id 53
    priority 100
    advert_int 1
    unicast_src_ip 10.231.250.12
    unicast_peer {
        10.231.250.11
    }
    virtual_ipaddress {
        10.231.250.10/24
    }
    track_script {
        chk_telltale
    }
}

# The second network (T24.32): a VLAN the node is on directly, with its own VIP and its own
# virtual_router_id. The same health check drives both instances, so a node that fails (or is in
# maintenance) gives up both VIPs, and the peer takes both.
vrrp_instance DNS_VIP_VLAN2 {
    state BACKUP
    interface @iface:10.231.251.12@
    virtual_router_id 54
    priority 100
    advert_int 1
    unicast_src_ip 10.231.251.12
    unicast_peer {
        10.231.251.11
    }
    virtual_ipaddress {
        10.231.251.10/24
    }
    track_script {
        chk_telltale
    }
}
