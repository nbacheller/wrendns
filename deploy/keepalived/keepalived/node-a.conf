# keepalived for telltale-a (REQ: CLU-004). Both nodes run the same VRRP instance on the VIP
# 10.231.250.10. node-a has the higher priority, so it holds the VIP while it is healthy.
# Unicast (no multicast on the Docker bridge): each node sends its adverts to the other.
global_defs {
    router_id telltale-a
    vrrp_skip_check_adv_addr
    # The health check is the one script; it runs as root (it only reads the node's own endpoints).
    enable_script_security
    script_user root
}

vrrp_script chk_telltale {
    script "/usr/local/bin/check-telltale.sh"
    interval 2
    fall 2
    rise 2
    # A failing node drops below its peer (150 - 60 = 90 < 100), so the peer takes the VIP.
    weight -60
}

vrrp_instance DNS_VIP {
    state BACKUP
    interface eth0
    virtual_router_id 53
    priority 150
    advert_int 1
    unicast_src_ip 10.231.250.11
    unicast_peer {
        10.231.250.12
    }
    virtual_ipaddress {
        10.231.250.10/24
    }
    track_script {
        chk_telltale
    }
}
