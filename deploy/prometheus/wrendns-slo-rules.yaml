# Generated by deploy/prometheus/build.sh from the Helm chart (prometheusRule.slo). Do not edit.
# WrenDNS service-level objectives (OBS-016): availability 99.9% (answers that aren't
# SERVFAIL), latency 99% within 250 ms, as in the default [slo] section. Load it with
# rule_files in prometheus.yml; the scrape job must be named wrendns-metrics.
groups:
- name: wrendns-slo
  rules:
  - record: wrendns:slo_availability_errors:ratio_rate5m
    expr: sum(rate(wrendns_responses_total{job=~"wrendns(-resolver)?-metrics",rcode="SERVFAIL"}[5m])) / sum(rate(wrendns_responses_total{job=~"wrendns(-resolver)?-metrics"}[5m]))
  - record: wrendns:slo_latency_errors:ratio_rate5m
    expr: 1 - sum(rate(wrendns_query_duration_seconds_bucket{job=~"wrendns(-resolver)?-metrics",le="0.25"}[5m])) / sum(rate(wrendns_query_duration_seconds_count{job=~"wrendns(-resolver)?-metrics"}[5m]))
  - record: wrendns:slo_availability_errors:ratio_rate30m
    expr: sum(rate(wrendns_responses_total{job=~"wrendns(-resolver)?-metrics",rcode="SERVFAIL"}[30m])) / sum(rate(wrendns_responses_total{job=~"wrendns(-resolver)?-metrics"}[30m]))
  - record: wrendns:slo_latency_errors:ratio_rate30m
    expr: 1 - sum(rate(wrendns_query_duration_seconds_bucket{job=~"wrendns(-resolver)?-metrics",le="0.25"}[30m])) / sum(rate(wrendns_query_duration_seconds_count{job=~"wrendns(-resolver)?-metrics"}[30m]))
  - record: wrendns:slo_availability_errors:ratio_rate1h
    expr: sum(rate(wrendns_responses_total{job=~"wrendns(-resolver)?-metrics",rcode="SERVFAIL"}[1h])) / sum(rate(wrendns_responses_total{job=~"wrendns(-resolver)?-metrics"}[1h]))
  - record: wrendns:slo_latency_errors:ratio_rate1h
    expr: 1 - sum(rate(wrendns_query_duration_seconds_bucket{job=~"wrendns(-resolver)?-metrics",le="0.25"}[1h])) / sum(rate(wrendns_query_duration_seconds_count{job=~"wrendns(-resolver)?-metrics"}[1h]))
  - record: wrendns:slo_availability_errors:ratio_rate6h
    expr: sum(rate(wrendns_responses_total{job=~"wrendns(-resolver)?-metrics",rcode="SERVFAIL"}[6h])) / sum(rate(wrendns_responses_total{job=~"wrendns(-resolver)?-metrics"}[6h]))
  - record: wrendns:slo_latency_errors:ratio_rate6h
    expr: 1 - sum(rate(wrendns_query_duration_seconds_bucket{job=~"wrendns(-resolver)?-metrics",le="0.25"}[6h])) / sum(rate(wrendns_query_duration_seconds_count{job=~"wrendns(-resolver)?-metrics"}[6h]))
  - record: wrendns:slo_availability_errors:ratio_rate3d
    expr: sum(rate(wrendns_responses_total{job=~"wrendns(-resolver)?-metrics",rcode="SERVFAIL"}[3d])) / sum(rate(wrendns_responses_total{job=~"wrendns(-resolver)?-metrics"}[3d]))
  - record: wrendns:slo_latency_errors:ratio_rate3d
    expr: 1 - sum(rate(wrendns_query_duration_seconds_bucket{job=~"wrendns(-resolver)?-metrics",le="0.25"}[3d])) / sum(rate(wrendns_query_duration_seconds_count{job=~"wrendns(-resolver)?-metrics"}[3d]))
  - alert: WrenDNSSLOAvailabilityBurnFast
    expr: |
      wrendns:slo_availability_errors:ratio_rate1h > (14.4 * (1 - 0.999))
      and wrendns:slo_availability_errors:ratio_rate5m > (14.4 * (1 - 0.999))
      and on() sum(increase(wrendns_responses_total{job=~"wrendns(-resolver)?-metrics"}[5m])) >= 50
      and on() sum(increase(wrendns_responses_total{job=~"wrendns(-resolver)?-metrics",rcode="SERVFAIL"}[1h])) >= 10
    labels:
      severity: critical
      slo: availability
    annotations:
      summary: The availability objective (99.9%) is spending its error budget over 14.4x too fast (SERVFAIL answers over the last 1h and 5m); see the dashboard's Service level card.
  - alert: WrenDNSSLOAvailabilityBurnSlow
    expr: |
      wrendns:slo_availability_errors:ratio_rate6h > (6 * (1 - 0.999))
      and wrendns:slo_availability_errors:ratio_rate30m > (6 * (1 - 0.999))
      and on() sum(increase(wrendns_responses_total{job=~"wrendns(-resolver)?-metrics"}[30m])) >= 50
      and on() sum(increase(wrendns_responses_total{job=~"wrendns(-resolver)?-metrics",rcode="SERVFAIL"}[6h])) >= 10
    labels:
      severity: critical
      slo: availability
    annotations:
      summary: The availability objective (99.9%) is spending its error budget over 6x too fast (SERVFAIL answers over the last 6h and 30m); see the dashboard's Service level card.
  - alert: WrenDNSSLOAvailabilityBurnTicket
    expr: |
      wrendns:slo_availability_errors:ratio_rate3d > (1 * (1 - 0.999))
      and wrendns:slo_availability_errors:ratio_rate6h > (1 * (1 - 0.999))
      and on() sum(increase(wrendns_responses_total{job=~"wrendns(-resolver)?-metrics"}[6h])) >= 50
      and on() sum(increase(wrendns_responses_total{job=~"wrendns(-resolver)?-metrics",rcode="SERVFAIL"}[3d])) >= 10
    labels:
      severity: warning
      slo: availability
    annotations:
      summary: The availability objective (99.9%) is spending its error budget over 1x too fast (SERVFAIL answers over the last 3d and 6h); see the dashboard's Service level card.
  - alert: WrenDNSSLOLatencyBurnFast
    expr: |
      wrendns:slo_latency_errors:ratio_rate1h > (14.4 * (1 - 0.99))
      and wrendns:slo_latency_errors:ratio_rate5m > (14.4 * (1 - 0.99))
      and on() sum(increase(wrendns_query_duration_seconds_count{job=~"wrendns(-resolver)?-metrics"}[5m])) >= 50
      and on() (sum(increase(wrendns_query_duration_seconds_count{job=~"wrendns(-resolver)?-metrics"}[1h])) - sum(increase(wrendns_query_duration_seconds_bucket{job=~"wrendns(-resolver)?-metrics",le="0.25"}[1h]))) >= 10
    labels:
      severity: critical
      slo: latency
    annotations:
      summary: The latency objective (99%) is spending its error budget over 14.4x too fast (answers slower than 250 ms over the last 1h and 5m); see the dashboard's Service level card.
  - alert: WrenDNSSLOLatencyBurnSlow
    expr: |
      wrendns:slo_latency_errors:ratio_rate6h > (6 * (1 - 0.99))
      and wrendns:slo_latency_errors:ratio_rate30m > (6 * (1 - 0.99))
      and on() sum(increase(wrendns_query_duration_seconds_count{job=~"wrendns(-resolver)?-metrics"}[30m])) >= 50
      and on() (sum(increase(wrendns_query_duration_seconds_count{job=~"wrendns(-resolver)?-metrics"}[6h])) - sum(increase(wrendns_query_duration_seconds_bucket{job=~"wrendns(-resolver)?-metrics",le="0.25"}[6h]))) >= 10
    labels:
      severity: critical
      slo: latency
    annotations:
      summary: The latency objective (99%) is spending its error budget over 6x too fast (answers slower than 250 ms over the last 6h and 30m); see the dashboard's Service level card.
  - alert: WrenDNSSLOLatencyBurnTicket
    expr: |
      wrendns:slo_latency_errors:ratio_rate3d > (1 * (1 - 0.99))
      and wrendns:slo_latency_errors:ratio_rate6h > (1 * (1 - 0.99))
      and on() sum(increase(wrendns_query_duration_seconds_count{job=~"wrendns(-resolver)?-metrics"}[6h])) >= 50
      and on() (sum(increase(wrendns_query_duration_seconds_count{job=~"wrendns(-resolver)?-metrics"}[3d])) - sum(increase(wrendns_query_duration_seconds_bucket{job=~"wrendns(-resolver)?-metrics",le="0.25"}[3d]))) >= 10
    labels:
      severity: warning
      slo: latency
    annotations:
      summary: The latency objective (99%) is spending its error budget over 1x too fast (answers slower than 250 ms over the last 3d and 6h); see the dashboard's Service level card.
