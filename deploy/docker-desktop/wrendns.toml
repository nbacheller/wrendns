# WrenDNS for Docker Desktop: the fork's router, Home Assistant, and device-name features.
# Check edits with:  docker compose run --rm wrendns config check /etc/wrendns/wrendns.toml
config_version = 1

# DNS on 1053 inside the container (Docker Desktop maps it to the same port on your machine).
[[listen]]
proto = "udp"
addr = "0.0.0.0:1053"
[[listen]]
proto = "tcp"
addr = "0.0.0.0:1053"

[[upstream]]
name = "cloudflare"
url = "tls://1.1.1.1:853"
tls_server_name = "cloudflare-dns.com"
[[upstream]]
name = "quad9"
url = "tls://9.9.9.9:853"
tls_server_name = "dns.quad9.net"
[[upstream_group]]
name = "default"
members = ["cloudflare", "quad9"]
strategy = "fastest"

# Ad block: HaGeZi's Pro list, as the Ad Block category (no hand-written list, so it is downloaded
# once and the checkbox on the Groups page is live).
[[group]]
name = "default"
content = { ads = true }

# Your UniFi console (UDM/UCG): connected clients, reservations, and networks (read-only).
# API key: UniFi Network → Settings → Control Plane → Integrations → Create API key.
[[router]]
name = "gateway"
type = "unifi"
url = "https://192.0.2.1"              # your gateway's address
api_key_file = "/run/secrets/unifi-key"
# The gateway's certificate is self-signed. To try it quickly, skip verification (anything on
# your LAN could then pose as the gateway). To verify it instead, save its certificate as
# secrets/ucg.pem (README.md) and use the two lines below.
tls_insecure_skip_verify = true
# tls_ca = "/run/secrets/ucg.pem"
# tls_server_name = "unifi.local"

# Your Home Assistant: the names you gave devices there (read-only, by MAC address).
# Token: a dedicated administrator user in Home Assistant → its profile → Security →
# Long-lived access tokens (rendering the registry template needs an administrator).
[[router]]
name = "home-assistant"
type = "home_assistant"
url = "http://homeassistant.local:8123"
api_key_file = "/run/secrets/ha-token"

# Answer the devices' names in DNS: kitchen-tablet.home.arpa, with PTRs.
[local]
device_domain = "home.arpa"

# A group for Home Assistant's "quarantine" action: everything is blocked for its devices
# (local names still answer). Devices get into it only when you, or an automation, put them
# there.
[[group]]
name = "quarantine"
schedules = ["quarantine-always"]
[[schedule]]
name = "quarantine-always"
action = "block_all"
window = [{ days = ["daily"], start = "00:00", end = "24:00" }]

[telemetry.qlog]
retention_days = 7
