{{- if and .Values.secretsKey.generate (not .Values.secretsKey.existingSecret) }}
{{- $name := include "telltale.secretsKeySecret" . }}
{{- $old := lookup "v1" "Secret" .Release.Namespace $name }}
# REQ: OPS-014 (ADR-167 §3) — the secrets store's key, made once and kept on upgrade and
# uninstall (`lookup`). Under `helm template` or Argo CD there is nothing to look up, so every
# render makes a new key and the secrets stored under the old one can't be read: use
# secretsKey.existingSecret there. The key is `ttsk1:` and 43 base64url characters (32 bytes;
# the last character is `A`, so the trailing bits are zero as the decoder requires).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "telltale.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.secretsKey.key }}: {{ if and $old (hasKey $old.data .Values.secretsKey.key) }}{{ index $old.data .Values.secretsKey.key }}{{ else }}{{ printf "ttsk1:%sA" (randAlphaNum 42) | b64enc }}{{ end }}
{{- end }}
