apiVersion: v2
name: wrendns
description: >-
  WrenDNS: a filtering, encrypted, observable DNS resolver with a built-in web UI and API.
type: application
# REQ: OPS-002 — chart version; appVersion is the image tag used when image.tag is empty.
version: 0.8.0
appVersion: "edge"
kubeVersion: ">=1.26.0-0"
home: https://wrendns.com/
sources:
  - https://github.com/nbacheller/wrendns
keywords: [dns, resolver, adblock, dot, doh, prometheus]
maintainers:
  - name: WrenDNS
    url: https://github.com/nbacheller/wrendns
# REQ: ADR-1033 — WrenDNS is AGPL-3.0-or-later (Chart.yaml v2 has no licence field; Artifact Hub reads this).
annotations:
  artifacthub.io/license: AGPL-3.0-or-later
