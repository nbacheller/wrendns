[package]
name = "wrendns-fuzz"
version = "0.0.0"
publish = false
license = "AGPL-3.0-or-later"
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Standalone workspace: built with nightly via `cargo +nightly fuzz run <target>` (NFR-004).
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
wrendns-proto = { path = "../crates/wrendns-proto" }
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
wrendns-cache = { path = "../crates/wrendns-cache" }
wrendns-config = { path = "../crates/wrendns-config" }
wrendns-filter = { path = "../crates/wrendns-filter" }
regex-syntax = "0.8"
wrendns-store = { path = "../crates/wrendns-store" }
wrendns-telemetry = { path = "../crates/wrendns-telemetry" }
wrendns-support = { path = "../crates/wrendns-support" }
wrendns-snmp = { path = "../crates/wrendns-snmp" }
serde = { version = "1.0.229", features = ["derive"] }
# The async frame reader (`discovery/frames.rs`) is fuzzed beside the sync one (DSC-002).
tokio = { version = "1.53.1", features = ["io-util"] }

[[bin]]
name = "parse_query"
path = "fuzz_targets/parse_query.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_response"
path = "fuzz_targets/parse_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cache_response"
path = "fuzz_targets/cache_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "differential"
path = "fuzz_targets/differential.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_list"
path = "fuzz_targets/parse_list.rs"
test = false
doc = false
bench = false

[[bin]]
name = "catalog_parse"
path = "fuzz_targets/catalog_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "qlog_segment"
path = "fuzz_targets/qlog_segment.rs"
test = false
doc = false
bench = false

[[bin]]
name = "support_redact"
path = "fuzz_targets/support_redact.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1

[[bin]]
name = "inventory_merge"
path = "fuzz_targets/inventory_merge.rs"
test = false
doc = false
bench = false

[[bin]]
name = "worker_frames"
path = "fuzz_targets/worker_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "snmp_ber"
path = "fuzz_targets/snmp_ber.rs"
test = false
doc = false
bench = false

[[bin]]
name = "snmp_walk"
path = "fuzz_targets/snmp_walk.rs"
test = false
doc = false
bench = false

[[bin]]
name = "snmp_usm"
path = "fuzz_targets/snmp_usm.rs"
test = false
doc = false
bench = false
